<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tempo Continuum — Notícias</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&amp;display=swap">
<style>
body{margin:0;font-family:"Gotham Medium","Gotham","GothamMedium","Montserrat","Helvetica Neue",Arial,sans-serif;font-weight:500}
h1,h2,h3,h4,p{font-weight:500}
a{color:inherit}a:hover{text-decoration-thickness:2px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid currentColor;outline-offset:3px}
@media (max-width: 760px){
.tc-header-row{flex-wrap:nowrap !important;gap:8px !important;padding:10px 16px !important}
.tc-nav,.tc-buscar{display:none !important}
.tc-logo{margin-right:auto;min-width:0}
.tc-tema-txt{display:none}
.tc-tema{padding:8px 12px !important}
.tc-menu-btn{display:flex !important}
.tc-painel{display:block !important}
.tc-chips{flex-wrap:nowrap !important;overflow-x:auto;padding-bottom:8px;margin-right:-16px;padding-right:16px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tc-chips>*{flex:none}
main{padding-left:16px !important;padding-right:16px !important;gap:32px !important}
footer>div{padding-left:16px !important;padding-right:16px !important}
}
</style>
<style>html,body{margin:0} #app > div{min-height:100vh}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="background: {{c.bg}}; color: {{c.ink}}; min-height: 100%; font-family: &quot;Gotham Medium&quot;, &quot;Gotham&quot;, &quot;Montserrat&quot;, Arial, sans-serif; font-weight: 500;">

  <header style="background: {{c.bg}}; color: {{c.ink}}; border-bottom: 2px solid {{c.ink}};">
    <div class="tc-header-row" style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 40px;">
      <a class="tc-logo" href="index.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit;" aria-label="Tempo Continuum, início">
        <sc-if value="{{claro}}" hint-placeholder-val="{{true}}"><img src="logos/logo-claro.png" alt="" width="48" height="48" style="display: block; width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: none;"></sc-if><sc-if value="{{escuro}}" hint-placeholder-val="{{false}}"><img src="logos/logo-escuro.png" alt="" width="48" height="48" style="display: block; width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: none;"></sc-if>
        <span style="font-size: 13px; line-height: 1.05; letter-spacing: 0.08em; text-transform: uppercase;">Tempo<br>Continuum</span>
      </a>
      <nav class="tc-nav" aria-label="Seções" style="display: flex; flex-wrap: wrap; gap: 6px 8px; flex: 1 1 560px; font-size: 15px;">
        <a href="noticias.html" aria-current="page" style="text-decoration: none; padding: 8px 14px; border-radius: 999px; background: #8EA612; color: #060308;">Notícias</a>
        <a href="politicos.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Políticos</a>
        <a href="casos.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Casos</a>
        <a href="documentarios.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Documentários</a>
        <a href="dossies.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Dossiês</a>
        <a href="cursos.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Cursos</a>
        <a href="ferramentas.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Ferramentas</a>
      </nav>
      <a class="tc-buscar" href="#busca" style="display: flex; align-items: center; gap: 8px; text-decoration: none; border: 2px solid {{c.ink}}; border-radius: 999px; padding: 8px 16px; font-size: 14px; min-height: 44px; box-sizing: border-box;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Buscar</a>
      <button type="button" class="tc-tema" onClick="{{alternarTema}}" aria-label="{{temaLabel}}" style="display: flex; align-items: center; gap: 8px; font: inherit; font-size: 14px; border: 2px solid {{c.ink}}; background: {{c.ink}}; color: {{c.bg}}; border-radius: 999px; padding: 8px 16px; min-height: 44px; box-sizing: border-box; cursor: pointer;">
        <sc-if value="{{claro}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></sc-if>
        <sc-if value="{{escuro}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
        <span class="tc-tema-txt">{{temaTexto}}</span>
      </button>
      <button type="button" class="tc-menu-btn" onClick="{{alternarMenu}}" aria-expanded="{{menuAbertoTxt}}" aria-controls="tc-painel" style="display: none; align-items: center; gap: 8px; font: inherit; font-size: 14px; border: 2px solid {{c.ink}}; background: transparent; color: {{c.ink}}; border-radius: 999px; padding: 8px 14px; min-height: 44px; box-sizing: border-box; cursor: pointer;">
        <sc-if value="{{menuFechado}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></sc-if>
        <sc-if value="{{menuAberto}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></sc-if>
        Menu
      </button>
    </div>
    <sc-if value="{{menuAberto}}" hint-placeholder-val="{{false}}">
      <nav id="tc-painel" class="tc-painel" aria-label="Menu" style="display: none; border-top: 1px solid {{c.line}}; padding: 4px 16px 12px;">
        <a href="index.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Início</a>
        <a href="noticias.html" aria-current="page" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}}; background: #8EA612; color: #060308;">Notícias</a>
        <a href="politicos.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Políticos</a>
        <a href="casos.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Casos</a>
        <a href="documentarios.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Documentários</a>
        <a href="dossies.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Dossiês</a>
        <a href="cursos.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Cursos</a>
        <a href="ferramentas.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Ferramentas</a>
        <a href="#busca" onClick="{{fecharMenu}}" style="text-decoration: none; display: flex; align-items: center; gap: 10px; padding: 14px 12px; font-size: 18px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Buscar</a>
      </nav>
    </sc-if>
  </header>

  <main style="max-width: 1240px; margin: 0 auto; padding: 32px 24px 80px; display: flex; flex-direction: column; gap: 32px;">
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <p style="margin: 0; font-size: 13px; color: {{c.muted}};"><a href="index.html" style="text-underline-offset: 3px;">Início</a> / Notícias</p>
      <h1 style="margin: 0; font-size: clamp(2.4rem, 5vw, 3.6rem); line-height: 1; letter-spacing: -0.02em;"><span style="background: #8EA612; color: #060308; padding: 0 10px;">Notícias</span></h1>
      <p style="margin: 0; font-size: 1.1rem; line-height: 1.55; color: {{c.muted}}; max-width: 60ch;">Tudo o que foi publicado, do mais recente ao mais antigo. Busque por palavra, marque uma ou mais tags ou limite o período.</p>
      <sc-if value="{{temFicticio}}" hint-placeholder-val="{{true}}"><p style="margin: 0; align-self: flex-start; font-size: 13px; border: 1.5px dashed {{c.muted}}; padding: 8px 12px; color: {{c.muted}};">As notícias marcadas como “Exemplo fictício” são inventadas e servem só para demonstrar o site. Lugares, empresas e pessoas foram inventados.</p></sc-if>
    </div>

    <section id="busca" aria-label="Filtros" style="display: flex; flex-direction: column; gap: 16px; border-top: 2px solid {{c.ink}}; border-bottom: 1px solid {{c.line}}; padding: 20px 0;">
      <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;">
        <div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
          <label for="nq" style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}};">Buscar</label>
          <input id="nq" type="search" value="{{q}}" onChange="{{onQ}}" placeholder="Palavra no título, na linha fina ou nas tags" autocomplete="off" style="font: inherit; font-size: 16px; padding: 12px 14px; border: 2px solid {{c.ink}}; background: {{c.bg}}; color: {{c.ink}}; border-radius: 0; min-width: 0;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label for="nde" style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}};">De</label>
          <input id="nde" type="date" value="{{de}}" onChange="{{onDe}}" style="font: inherit; font-size: 14px; padding: 11px 10px; border: 1.5px solid {{c.ink}}; background: {{c.bg}}; color: {{c.ink}};">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label for="nate" style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}};">Até</label>
          <input id="nate" type="date" value="{{ate}}" onChange="{{onAte}}" style="font: inherit; font-size: 14px; padding: 11px 10px; border: 1.5px solid {{c.ink}}; background: {{c.bg}}; color: {{c.ink}};">
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}};">Tags</span>
        <div class="tc-chips" style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px;">
          <sc-for list="{{todasTags}}" as="t" hint-placeholder-count="12">
            <sc-if value="{{t.ativa}}" hint-placeholder-val="{{false}}">
              <button type="button" onClick="{{t.toggle}}" aria-pressed="true" style="font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px; background: #8EA612; color: #060308; border: 1.5px solid #8EA612; cursor: pointer;">{{t.nome}} · {{t.n}} ✕</button>
            </sc-if>
            <sc-if value="{{t.inativa}}" hint-placeholder-val="{{true}}">
              <button type="button" onClick="{{t.toggle}}" aria-pressed="false" style="font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px; background: transparent; color: {{c.ink}}; border: 1.5px solid {{c.line}}; cursor: pointer;">{{t.nome}} · {{t.n}}</button>
            </sc-if>
          </sc-for>
        </div>
      </div>
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; font-size: 13px; color: {{c.muted}};">
        <span role="status">{{contagem}}</span>
        <sc-if value="{{temFiltros}}" hint-placeholder-val="{{false}}">
          <button type="button" onClick="{{limpar}}" style="font: inherit; font-size: 13px; background: none; border: 0; padding: 4px 0; color: {{c.ink}}; text-decoration: underline; text-underline-offset: 3px; cursor: pointer;">Limpar filtros</button>
        </sc-if>
      </div>
    </section>

    <sc-if value="{{vazio}}" hint-placeholder-val="{{false}}">
      <div style="border: 1.5px dashed {{c.line}}; padding: 28px 24px; display: flex; flex-direction: column; gap: 6px;">
        <strong style="font-size: 1.2rem; font-weight: 500;">Nenhuma notícia com esses filtros</strong>
        <span style="color: {{c.muted}};">Desmarque uma tag, amplie o período ou use menos palavras na busca.</span>
      </div>
    </sc-if>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px 28px;">
      <sc-for list="{{itens}}" as="n" hint-placeholder-count="6">
        <article style="display: flex; flex-direction: column; gap: 10px;">
          <sc-if value="{{n.temFoto}}" hint-placeholder-val="{{false}}"><a href="{{n.link}}" tabindex="-1" aria-hidden="true" style="display: block;"><img src="{{n.foto}}" alt="" loading="lazy" style="display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border: 1px solid {{c.line}}; box-sizing: border-box;"></a></sc-if><sc-if value="{{n.semFoto}}" hint-placeholder-val="{{true}}"><div style="aspect-ratio: 3 / 2; background: {{c.surface}}; border: 1px solid {{c.line}}; display: flex; align-items: flex-end; padding: 10px; box-sizing: border-box; font-size: 12px; color: {{c.muted}};">[Foto]</div></sc-if>
          <div style="display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: {{c.muted}};">
            <span>{{n.dataTexto}}</span>
            <span>·</span>
            <span style="text-transform: uppercase; letter-spacing: 0.08em; color: {{c.ink}};">{{n.editoria}}</span>
            <sc-if value="{{n.ficticio}}" hint-placeholder-val="{{true}}"><span style="border: 1px dashed {{c.muted}}; padding: 1px 6px;">Exemplo fictício</span></sc-if>
          </div>
          <h2 style="margin: 0; font-size: 1.25rem; line-height: 1.25; text-wrap: balance;"><a href="{{n.link}}" style="text-decoration: none;">{{n.titulo}}</a></h2>
          <p style="margin: 0; font-size: 0.92rem; line-height: 1.55; color: {{c.muted}};">{{n.linha}}</p>
          <div style="display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px;">
            <sc-for list="{{n.tags}}" as="t" hint-placeholder-count="3">
              <sc-if value="{{t.ativa}}" hint-placeholder-val="{{false}}">
                <button type="button" onClick="{{t.toggle}}" aria-pressed="true" style="font: inherit; font-size: 12px; padding: 3px 9px; border-radius: 999px; background: #8EA612; color: #060308; border: 1.5px solid #8EA612; cursor: pointer;">{{t.nome}}</button>
              </sc-if>
              <sc-if value="{{t.inativa}}" hint-placeholder-val="{{true}}">
                <button type="button" onClick="{{t.toggle}}" aria-pressed="false" style="font: inherit; font-size: 12px; padding: 3px 9px; border-radius: 999px; background: transparent; color: {{c.ink}}; border: 1.5px solid {{c.line}}; cursor: pointer;">{{t.nome}}</button>
              </sc-if>
            </sc-for>
          </div>
        </article>
      </sc-for>
    </div>
  </main>

  <footer style="background: #060308; color: #F2EEE9; border-top: 1px solid {{c.line}};">
    <div style="max-width: 1240px; margin: 0 auto; padding: 48px 24px 40px; display: flex; flex-wrap: wrap; gap: 40px; justify-content: space-between;">
      <div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 12px;">
        <p style="margin: 0; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;">Tempo Continuum</p>
        <p style="margin: 0; font-size: 1.4rem; line-height: 1.25; max-width: 24ch;"><span style="background: #8EA612; color: #060308; padding: 0 6px; box-decoration-break: clone; -webkit-box-decoration-break: clone;">Conhecer o passado. Organizar o presente. Construir o futuro.</span></p>
      </div>
      <nav aria-label="Rodapé" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 40px; font-size: 14px; align-content: start;">
        <a href="noticias.html" style="text-decoration: none;">Notícias</a>
        <a href="dossies.html" style="text-decoration: none;">Dossiês</a>
        <a href="politicos.html" style="text-decoration: none;">Políticos</a>
        <a href="cursos.html" style="text-decoration: none;">Cursos</a>
        <a href="casos.html" style="text-decoration: none;">Casos</a>
        <a href="index.html" style="text-decoration: none;">Início</a>
        <a href="documentarios.html" style="text-decoration: none;">Documentários</a>
        <a href="ferramentas.html" style="text-decoration: none;">Ferramentas</a>
      </nav>
    </div>
  </footer>
</div>
</template>
<script src="js/runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { escuro: null, q: '', tags: [], de: '', ate: '', remoto: null };
  }
  componentDidMount() {
    try {
      var ls = window.localStorage;
      var v = ls.getItem('tc-tema');
      var patch = {};
      if (v === 'escuro' || v === 'claro') patch.escuro = v === 'escuro';
      var t = ls.getItem('tc-busca-tag');
      if (t) { patch.tags = [t]; ls.removeItem('tc-busca-tag'); }
      var q = ls.getItem('tc-busca-q');
      if (q) { patch.q = q; ls.removeItem('tc-busca-q'); }
      this.setState(patch);
    } catch (e) {}
    var self = this;
    try {
      fetch('dados/noticias.json', { cache: 'no-cache' })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (lista) { if (Array.isArray(lista)) self.setState({ remoto: lista }); })
        .catch(function () {});
    } catch (e) {}
  }
  exemplos() {
    return [{"id": "2026-10-28-motoristas-de-aplicativo-de-santa-aurora-param-por-48-horas", "titulo": "Motoristas de aplicativo de Santa Aurora param por 48 horas", "linha": "A categoria reivindica tarifa mínima por corrida e explicação para os bloqueios de conta.", "data": "2026-10-28T09:00:00-03:00", "editoria": "Trabalho", "tags": ["trabalho", "greve", "plataformas"], "autor": "Redação", "foto": "", "destaque": true, "ficticio": true}, {"id": "2026-10-24-assentamento-terra-viva-colhe-a-primeira-safra-de-arroz-agro", "titulo": "Assentamento Terra Viva colhe a primeira safra de arroz agroecológico", "linha": "Depois de três anos de disputa judicial, as famílias vendem a produção em uma feira própria.", "data": "2026-10-24T09:00:00-03:00", "editoria": "Campo", "tags": ["reforma agrária", "agroecologia", "campo"], "autor": "Redação", "foto": "", "destaque": false, "ficticio": true}, {"id": "2026-10-21-professores-da-rede-municipal-de-porto-serrano-aprovam-estad", "titulo": "Professores da rede municipal de Porto Serrano aprovam estado de greve", "linha": "A assembleia pede reposição salarial e concurso para substituir os contratos temporários.", "data": "2026-10-21T09:00:00-03:00", "editoria": "Educação", "tags": ["trabalho", "educação", "greve"], "autor": "Redação", "foto": "", "destaque": false, "ficticio": true}, {"id": "2026-10-15-arquivo-de-vale-bonito-digitaliza-fichas-de-vigilancia-da-di", "titulo": "Arquivo de Vale Bonito digitaliza fichas de vigilância da ditadura", "linha": "O acervo ficará aberto à consulta pública a partir de dezembro.", "data": "2026-10-15T09:00:00-03:00", "editoria": "Memória", "tags": ["história do Brasil", "ditadura", "memória"], "autor": "Redação", "foto": "", "destaque": false, "ficticio": true}, {"id": "2026-10-09-camara-de-santa-aurora-debate-tarifa-zero-no-transporte-cole", "titulo": "Câmara de Santa Aurora debate tarifa zero no transporte coletivo", "linha": "O projeto prevê financiamento por uma taxa cobrada de grandes empregadores.", "data": "2026-10-09T09:00:00-03:00", "editoria": "Cidades", "tags": ["transporte", "cidades", "orçamento público"], "autor": "Redação", "foto": "", "destaque": false, "ficticio": true}, {"id": "2026-10-02-metalurgica-rio-claro-do-norte-anuncia-fechamento-de-unidade", "titulo": "Metalúrgica Rio Claro do Norte anuncia fechamento de unidade", "linha": "O sindicato tenta negociar a manutenção dos postos de trabalho.", "data": "2026-10-02T09:00:00-03:00", "editoria": "Trabalho", "tags": ["trabalho", "indústria", "sindicatos"], "autor": "Redação", "foto": "", "destaque": false, "ficticio": true}, {"id": "2026-09-26-grupo-de-estudos-reune-operarios-para-ler-o-capital", "titulo": "Grupo de estudos reúne operários para ler O Capital", "linha": "Os encontros semanais acontecem na sede do sindicato dos metalúrgicos de Porto Serrano.", "data": "2026-09-26T09:00:00-03:00", "editoria": "Formação", "tags": ["marxismo", "formação", "sindicatos"], "autor": "Redação", "foto": "", "destaque": false, "ficticio": true}, {"id": "2026-09-18-enchente-deixa-familias-desalojadas-na-periferia-de-vale-bon", "titulo": "Enchente deixa famílias desalojadas na periferia de Vale Bonito", "linha": "Movimentos de moradia cobram um plano de reassentamento da prefeitura.", "data": "2026-09-18T09:00:00-03:00", "editoria": "Cidades", "tags": ["moradia", "cidades", "meio ambiente"], "autor": "Redação", "foto": "", "destaque": false, "ficticio": true}];
  }
  dados() {
    var r = this.state && this.state.remoto;
    var lista = (r || this.exemplos()).map(function (n) { return Object.assign({}, n, { data: String(n.data || '').slice(0, 10), tags: n.tags || [] }); });
    return lista.sort(function (x, y) { return x.data < y.data ? 1 : -1; });
  }
  renderVals() {
    var self = this;
    var st = this.state || {};
    var escuro = (st.escuro !== null && st.escuro !== undefined) ? st.escuro : (this.props.tema ?? 'claro') === 'escuro';
    var c = escuro
      ? { bg: '#060308', surface: '#302D29', ink: '#F2EEE9', muted: '#DED5CA', line: 'rgba(222, 213, 202, 0.3)' }
      : { bg: '#F2EEE9', surface: '#DED5CA', ink: '#060308', muted: '#302D29', line: 'rgba(48, 45, 41, 0.28)' };
    var norm = function (s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); };
    var meses = ['jan.', 'fev.', 'mar.', 'abr.', 'maio', 'jun.', 'jul.', 'ago.', 'set.', 'out.', 'nov.', 'dez.'];
    var fmt = function (iso) { var p = iso.split('-'); return Number(p[2]) + ' ' + meses[Number(p[1]) - 1] + ' ' + p[0]; };
    var sel = st.tags || [];
    var selN = sel.map(norm);
    var toggle = function (nome) {
      return function () {
        var k = norm(nome);
        var atual = (self.state.tags || []).slice();
        var i = atual.map(norm).indexOf(k);
        if (i >= 0) atual.splice(i, 1); else atual.push(nome);
        self.setState({ tags: atual });
      };
    };
    var dados = this.dados();
    var palavras = norm(st.q).split(/\s+/).filter(Boolean);
    var filtrados = dados.filter(function (n) {
      if (st.de && n.data < st.de) return false;
      if (st.ate && n.data > st.ate) return false;
      var chaves = n.tags.map(norm);
      if (!selN.every(function (k) { return chaves.indexOf(k) >= 0; })) return false;
      var texto = norm([n.titulo, n.linha, n.editoria, n.tags.join(' ')].join(' '));
      return palavras.every(function (w) { return texto.indexOf(w) >= 0; });
    });
    var contas = {};
    dados.forEach(function (n) { n.tags.forEach(function (t) { contas[t] = (contas[t] || 0) + 1; }); });
    var todasTags = Object.keys(contas).sort(function (a, b) { return contas[b] - contas[a] || a.localeCompare(b, 'pt'); }).map(function (t) {
      var ativa = selN.indexOf(norm(t)) >= 0;
      return { nome: t, n: contas[t], ativa: ativa, inativa: !ativa, toggle: toggle(t) };
    });
    var itens = filtrados.map(function (n) {
      return {
        id: n.id, titulo: n.titulo, linha: n.linha, editoria: n.editoria, dataTexto: fmt(n.data),
        link: 'materia.html?id=' + encodeURIComponent(n.id), foto: n.foto || '', temFoto: !!n.foto, semFoto: !n.foto, ficticio: !!n.ficticio,
        tags: n.tags.map(function (t) { var a = selN.indexOf(norm(t)) >= 0; return { nome: t, ativa: a, inativa: !a, toggle: toggle(t) }; })
      };
    });
    var temFiltros = !!(palavras.length || sel.length || st.de || st.ate);
    var contagem = temFiltros
      ? itens.length + ' de ' + dados.length + ' notícias' + (sel.length ? ' com ' + (sel.length === 1 ? 'a tag ' : 'as tags ') + sel.join(' + ') : '')
      : dados.length + ' notícias';
    return {
      temFicticio: dados.some(function (n) { return n.ficticio; }),
      menuAberto: !!(this.state && this.state.menuAberto),
      menuFechado: !(this.state && this.state.menuAberto),
      menuAbertoTxt: (this.state && this.state.menuAberto) ? 'true' : 'false',
      alternarMenu: (function (eu) { return function () { eu.setState({ menuAberto: !(eu.state && eu.state.menuAberto) }); }; })(this),
      fecharMenu: (function (eu) { return function () { eu.setState({ menuAberto: false }); }; })(this),
      c: c, escuro: escuro, claro: !escuro,
      temaTexto: escuro ? 'Claro' : 'Escuro',
      temaLabel: escuro ? 'Mudar para o tema claro' : 'Mudar para o tema escuro',
      alternarTema: function () {
        var novo = !escuro;
        self.setState({ escuro: novo });
        try { window.localStorage.setItem('tc-tema', novo ? 'escuro' : 'claro'); } catch (e) {}
      },
      q: st.q || '', de: st.de || '', ate: st.ate || '',
      onQ: function (e) { self.setState({ q: e.target.value }); },
      onDe: function (e) { self.setState({ de: e.target.value }); },
      onAte: function (e) { self.setState({ ate: e.target.value }); },
      limpar: function () { self.setState({ q: '', tags: [], de: '', ate: '' }); },
      todasTags: todasTags, itens: itens,
      vazio: itens.length === 0, temFiltros: temFiltros, contagem: contagem
    };
  }
}
iniciarPagina(Component, {"tema": "claro"});
