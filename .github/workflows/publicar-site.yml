# Publica o site no GitHub Pages a cada mudança no branch main.
# Antes de publicar, gera dados/noticias.json com as matérias de conteudo/noticias/.
# Requer: Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Gerar índice de matérias
        run: python3 scripts/gerar-indice.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
