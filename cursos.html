<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tempo Continuum — Cursos e Biblioteca</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&amp;display=swap">
<style>
body{margin:0;font-family:"Gotham Medium","Gotham","GothamMedium","Montserrat","Helvetica Neue",Arial,sans-serif;font-weight:500}
h1,h2,h3,h4,p{font-weight:500}
a{color:inherit}a:hover{text-decoration-thickness:2px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid currentColor;outline-offset:3px}
</style>
<style>html,body{margin:0} #app > div{min-height:100vh}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="background: {{c.bg}}; color: {{c.ink}}; min-height: 100%; font-family: &quot;Gotham Medium&quot;, &quot;Gotham&quot;, &quot;Montserrat&quot;, Arial, sans-serif; font-weight: 500;">

  <header style="background: {{c.bg}}; color: {{c.ink}}; border-bottom: 2px solid {{c.ink}};">
    <div style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 40px;">
      <a href="index.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit;" aria-label="Tempo Continuum, início">
        <sc-if value="{{claro}}" hint-placeholder-val="{{true}}"><img src="logos/logo-claro.png" alt="" width="48" height="48" style="display: block; width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: none;"></sc-if><sc-if value="{{escuro}}" hint-placeholder-val="{{false}}"><img src="logos/logo-escuro.png" alt="" width="48" height="48" style="display: block; width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: none;"></sc-if>
        <span style="font-size: 13px; line-height: 1.05; letter-spacing: 0.08em; text-transform: uppercase;">Tempo<br>Continuum</span>
      </a>
      <nav aria-label="Seções" style="display: flex; flex-wrap: wrap; gap: 6px 8px; flex: 1 1 560px; font-size: 15px;">
        <a href="noticias.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Notícias</a>
        <a href="politicos.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Políticos</a>
        <a href="casos.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Casos</a>
        <a href="documentarios.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Documentários</a>
        <a href="dossies.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Dossiês</a>
        <a href="cursos.html" aria-current="page" style="text-decoration: none; padding: 8px 14px; border-radius: 999px; background: #8EA612; color: #060308;">Cursos</a>
        <a href="ferramentas.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Ferramentas</a>
      </nav>
      <a href="noticias.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; border: 2px solid {{c.ink}}; border-radius: 999px; padding: 8px 16px; font-size: 14px; min-height: 44px; box-sizing: border-box;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Buscar</a>
      <button type="button" onClick="{{alternarTema}}" aria-label="{{temaLabel}}" style="display: flex; align-items: center; gap: 8px; font: inherit; font-size: 14px; border: 2px solid {{c.ink}}; background: {{c.ink}}; color: {{c.bg}}; border-radius: 999px; padding: 8px 16px; min-height: 44px; box-sizing: border-box; cursor: pointer;">
        <sc-if value="{{claro}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></sc-if>
        <sc-if value="{{escuro}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
        {{temaTexto}}
      </button>
    </div>
  </header>

  <main style="max-width: 1240px; margin: 0 auto; padding: 32px 24px 80px; display: flex; flex-direction: column; gap: 48px;">
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <p style="margin: 0; font-size: 13px; color: {{c.muted}};"><a href="index.html" style="text-underline-offset: 3px;">Início</a> / Cursos</p>
      <h1 style="margin: 0; font-size: clamp(2.4rem, 5vw, 3.6rem); line-height: 1; letter-spacing: -0.02em;"><span style="background: #8EA612; color: #060308; padding: 0 10px;">Cursos</span></h1>
      <p style="margin: 0; font-size: 1.1rem; line-height: 1.55; color: {{c.muted}}; max-width: 62ch;">Formação política em módulos, para estudar no seu ritmo ou em grupo. Cada curso indica leituras da biblioteca, todas gratuitas e em domínio público.</p>
    </div>

    <section aria-label="Cursos" style="display: flex; flex-direction: column; border-top: 2px solid {{c.ink}};">
      <sc-for list="{{cursos}}" as="k" hint-placeholder-count="5">
        <article style="display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; padding: 28px 0; border-bottom: 1px solid {{c.line}};">
          <div style="flex: 999 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 8px;">
            <h2 style="margin: 0; font-size: 1.7rem; line-height: 1.15;">{{k.nome}}</h2>
            <p style="margin: 0; font-size: 0.95rem; line-height: 1.55; color: {{c.muted}}; max-width: 62ch;">[Duas frases sobre o que o curso cobre e para quem ele é.]</p>
            <span style="font-size: 13px; color: {{c.muted}};">[N] módulos · [N] aulas · [carga horária] · {{k.nLivros}} leituras na biblioteca</span>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 10px;">
            <a href="#biblioteca" onClick="{{k.verLeituras}}" style="text-decoration: none; border: 2px solid {{c.ink}}; padding: 10px 18px; font-size: 14px;">Leituras do curso</a>
            <a href="#" style="text-decoration: none; background: #8EA612; color: #060308; padding: 12px 22px; font-size: 14px;">Inscrever-se</a>
          </div>
        </article>
      </sc-for>
    </section>

    <section id="biblioteca" aria-labelledby="h-biblioteca" style="display: flex; flex-direction: column; gap: 22px; scroll-margin-top: 16px;">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 24px; border-top: 2px solid {{c.ink}}; padding-top: 20px;">
        <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0;">
          <h2 id="h-biblioteca" style="margin: 0; font-size: 2rem; letter-spacing: -0.01em;"><span style="background: #8EA612; color: #060308; padding: 0 8px;">Biblioteca</span></h2>
          <p style="margin: 0; font-size: 0.95rem; line-height: 1.55; color: {{c.muted}}; max-width: 64ch;">Acervo da Biblioteca dos Camaradas, do Coletivo Lufã: 148 livros em domínio público, de Marx a Machado de Assis. Os PDFs são edições do coletivo, hospedadas no site deles.</p>
        </div>
        <a href="https://coletivolufa.github.io/biblioteca.html" target="_blank" rel="noopener noreferrer" style="font-size: 14px; text-underline-offset: 4px;">Abrir a Biblioteca dos Camaradas ↗</a>
      </div>

      <div style="display: flex; flex-direction: column; gap: 14px;">
        <div style="display: flex; flex-direction: column; gap: 6px; max-width: 640px;">
          <label for="bq" style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}};">Buscar na biblioteca</label>
          <input id="bq" type="search" value="{{q}}" onChange="{{onQ}}" placeholder="Livro, autor ou assunto" autocomplete="off" style="font: inherit; font-size: 16px; padding: 12px 14px; border: 2px solid {{c.ink}}; background: {{c.bg}}; color: {{c.ink}}; border-radius: 0; min-width: 0;">
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
          <sc-for list="{{estantes}}" as="e" hint-placeholder-count="14">
            <sc-if value="{{e.ativa}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{e.escolher}}" aria-pressed="true" title="{{e.descricao}}" style="font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px; background: #8EA612; color: #060308; border: 1.5px solid #8EA612; cursor: pointer;">{{e.nome}} · {{e.n}}</button></sc-if>
            <sc-if value="{{e.inativa}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{e.escolher}}" aria-pressed="false" title="{{e.descricao}}" style="font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px; background: transparent; color: {{c.ink}}; border: 1.5px solid {{c.line}}; cursor: pointer;">{{e.nome}} · {{e.n}}</button></sc-if>
          </sc-for>
        </div>
        <sc-if value="{{temCurso}}" hint-placeholder-val="{{false}}">
          <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; background: {{c.surface}}; border: 1px solid {{c.line}}; padding: 12px 16px; font-size: 14px;">
            <span>Leituras sugeridas para o curso <b style="font-weight: 500; background: #8EA612; color: #060308; padding: 0 6px;">{{cursoNome}}</b></span>
            <button type="button" onClick="{{limpar}}" style="font: inherit; font-size: 13px; background: none; border: 0; padding: 4px 0; color: {{c.ink}}; text-decoration: underline; text-underline-offset: 3px; cursor: pointer;">Ver toda a biblioteca</button>
          </div>
        </sc-if>
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; font-size: 13px; color: {{c.muted}};">
          <span role="status">{{contagem}}</span>
          <sc-if value="{{temFiltros}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{limpar}}" style="font: inherit; font-size: 13px; background: none; border: 0; padding: 0; color: {{c.ink}}; text-decoration: underline; text-underline-offset: 3px; cursor: pointer;">Limpar filtros</button></sc-if>
        </div>
      </div>

      <sc-if value="{{vazio}}" hint-placeholder-val="{{false}}">
        <div style="border: 1.5px dashed {{c.line}}; padding: 28px 24px; display: flex; flex-direction: column; gap: 6px;">
          <strong style="font-size: 1.2rem; font-weight: 500;">Nenhum livro encontrado</strong>
          <span style="color: {{c.muted}};">Tente outra palavra ou escolha outra estante.</span>
        </div>
      </sc-if>

      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 20px;">
        <sc-for list="{{livros}}" as="l" hint-placeholder-count="12">
          <article style="background: {{c.surface}}; border: 1px solid {{c.line}}; padding: 20px; display: flex; flex-direction: column; gap: 10px;">
            <div style="display: flex; flex-wrap: wrap; gap: 6px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: {{c.muted}};">
              <span>{{l.estantesTexto}}</span>
              <sc-if value="{{l.ingles}}" hint-placeholder-val="{{false}}"><span style="border: 1px solid {{c.ink}}; color: {{c.ink}}; padding: 0 5px;">Em inglês</span></sc-if>
            </div>
            <h3 style="margin: 0; font-size: 1.15rem; line-height: 1.25; text-wrap: balance;">{{l.titulo}}</h3>
            <p style="margin: 0; font-size: 0.85rem;">{{l.autor}} · {{l.ano}}</p>
            <p style="margin: 0; font-size: 0.85rem; line-height: 1.5; color: {{c.muted}}; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;">{{l.resumo}}</p>
            <div style="margin-top: auto; padding-top: 6px; display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px;">
              <a href="{{l.link}}" target="_blank" rel="noopener noreferrer" style="text-decoration: none; background: #8EA612; color: #060308; padding: 8px 12px;">Ler online ↗</a>
              <sc-if value="{{l.temPdf}}" hint-placeholder-val="{{true}}"><a href="{{l.pdf}}" target="_blank" rel="noopener noreferrer" style="text-decoration: none; border: 1.5px solid {{c.ink}}; padding: 7px 12px;">PDF · {{l.mbTexto}} ↗</a></sc-if>
            </div>
            <span style="font-size: 11px; color: {{c.muted}};">Texto: {{l.fonte}}</span>
          </article>
        </sc-for>
      </div>
      <sc-if value="{{temMais}}" hint-placeholder-val="{{true}}">
        <button type="button" onClick="{{mostrarMais}}" style="align-self: center; font: inherit; font-size: 14px; background: transparent; color: {{c.ink}}; border: 2px solid {{c.ink}}; padding: 12px 24px; cursor: pointer;">Mostrar mais livros ({{restantes}})</button>
      </sc-if>
      <p style="margin: 0; font-size: 12px; color: {{c.muted}};">Acervo copiado da Biblioteca dos Camaradas em 4 de novembro de 2026. Textos em domínio público; leitura online pelo Projeto Gutenberg, Wikisource e Marxists Internet Archive.</p>
    </section>
  </main>

  <footer style="background: #060308; color: #F2EEE9; border-top: 1px solid {{c.line}};">
    <div style="max-width: 1240px; margin: 0 auto; padding: 48px 24px 40px; display: flex; flex-wrap: wrap; gap: 40px; justify-content: space-between;">
      <div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 12px;">
        <p style="margin: 0; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;">Tempo Continuum</p>
        <p style="margin: 0; font-size: 1.4rem; line-height: 1.25; max-width: 24ch;"><span style="background: #8EA612; color: #060308; padding: 0 6px; box-decoration-break: clone; -webkit-box-decoration-break: clone;">Conhecer o passado. Organizar o presente. Construir o futuro.</span></p>
      </div>
      <nav aria-label="Rodapé" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 40px; font-size: 14px; align-content: start;">
        <a href="noticias.html" style="text-decoration: none;">Notícias</a>
        <a href="dossies.html" style="text-decoration: none;">Dossiês</a>
        <a href="politicos.html" style="text-decoration: none;">Políticos</a>
        <a href="cursos.html" style="text-decoration: none;">Cursos</a>
        <a href="casos.html" style="text-decoration: none;">Casos</a>
        <a href="index.html" style="text-decoration: none;">Início</a>
        <a href="documentarios.html" style="text-decoration: none;">Documentários</a>
        <a href="ferramentas.html" style="text-decoration: none;">Ferramentas</a>
      </nav>
    </div>
  </footer>
</div>
</template>
<script src="js/runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { escuro: null, q: '', estante: 'todas', curso: null, limite: 12 };
  }
  componentDidMount() {
    try {
      var v = window.localStorage.getItem('tc-tema');
      if (v === 'escuro' || v === 'claro') this.setState({ escuro: v === 'escuro' });
    } catch (e) {}
  }
  cursos() { return [["Marxismo", ["comece", "marxismo"]], ["Socialismo", ["revolucao", "comece"]], ["Direitos dos trabalhadores", ["revolucao", "historia"]], ["Crítica do capitalismo", ["marxismo"]], ["Revolução Brasileira", ["historia", "revolucao"]]]; }
  acervo() { return { estantes: [{"id": "comece", "nome": "Comece por aqui", "descricao": "Primeiros passos no marxismo, em textos curtos e diretos."}, {"id": "marxismo", "nome": "Marxismo e economia", "descricao": "Como o capitalismo funciona: trabalho, valor, lucro e crise."}, {"id": "revolucao", "nome": "Política e revolução", "descricao": "Estado, partido, organização e estratégia."}, {"id": "historia", "nome": "História", "descricao": "Relatos, crônicas e análises de momentos decisivos."}, {"id": "filosofia", "nome": "Filosofia", "descricao": "Das perguntas antigas ao materialismo histórico."}, {"id": "feminismo", "nome": "Feminismo e mulheres", "descricao": "A luta das mulheres por igualdade, trabalho e liberdade."}, {"id": "brasil", "nome": "Literatura brasileira", "descricao": "Romances e contos que contam o Brasil."}, {"id": "portugal", "nome": "Literatura portuguesa", "descricao": "Os grandes nomes da prosa em Portugal."}, {"id": "mundo", "nome": "Clássicos do mundo", "descricao": "Aventuras e romances de outros países, em português."}, {"id": "poesia", "nome": "Poesia", "descricao": "Versos de amor, de revolta e de saudade."}, {"id": "teatro", "nome": "Teatro", "descricao": "Peças para ler (e para montar com os camaradas)."}, {"id": "mitologia", "nome": "Mitologia e lendas", "descricao": "Deuses, heróis, lendas indígenas e contos populares."}, {"id": "religiao", "nome": "Religião e espiritualidade", "descricao": "Textos sagrados e o debate sobre a fé."}], livros: [{"id": "manifesto-do-partido-comunista", "titulo": "Manifesto do Partido Comunista", "autor": "Karl Marx e Friedrich Engels", "ano": 1848, "estantes": ["comece", "revolucao"], "resumo": "O texto mais famoso do marxismo. Em poucas páginas, Marx e Engels mostram que a história é a história da luta de classes, explicam como a burguesia revolucionou o mundo e criou seus próprios coveiros, e terminam com o chamado: trabalhadores de todos os países, uni-vos!", "link": "https://www.marxists.org/portugues/marx/1848/ManifestoDoPartidoComunista/index.htm", "fonte": "Marxists Internet Archive", "idioma": "pt", "destaque": true, "pdf": "https://coletivolufa.github.io/livros/manifesto-do-partido-comunista.pdf", "mb": 0.3}, {"id": "trabalho-assalariado-e-capital", "titulo": "Trabalho Assalariado e Capital", "autor": "Karl Marx", "ano": 1849, "estantes": ["comece", "marxismo"], "resumo": "Conferências para operários que explicam, de forma simples, o que é o salário, de onde vem o lucro e por que o crescimento do capital aumenta a dependência de quem trabalha.", "link": "https://www.marxists.org/portugues/marx/1849/04/05.htm", "fonte": "Marxists Internet Archive", "idioma": "pt", "destaque": false}, {"id": "salario-preco-e-lucro", "titulo": "Salário, Preço e Lucro", "autor": "Karl Marx", "ano": 1865, "estantes": ["comece", "marxismo"], "resumo": "Palestra feita para a Associação Internacional dos Trabalhadores. Marx resume a teoria do valor e da mais-valia e defende que a luta por salários é necessária, mas não basta.", "link": "https://www.marxists.org/portugues/marx/1865/salario/index.htm", "fonte": "Marxists Internet Archive", "idioma": "pt", "destaque": false}, {"id": "do-socialismo-utopico-ao-socialismo-cientifico", "titulo": "Do Socialismo Utópico ao Socialismo Científico", "autor": "Friedrich Engels", "ano": 1880, "estantes": ["comece", "filosofia"], "resumo": "Engels conta como o socialismo deixou de ser o sonho de pensadores generosos e passou a ser uma análise científica da sociedade, baseada no materialismo histórico. Uma das melhores introduções ao marxismo.", "link": "https://www.marxists.org/portugues/marx/1880/socialismo/index.htm", "fonte": "Marxists Internet Archive", "idioma": "pt", "destaque": true}, {"id": "sobre-o-papel-do-trabalho-na-transformacao-do-macaco-em-home", "titulo": "Sobre o Papel do Trabalho na Transformação do Macaco em Homem", "autor": "Friedrich Engels", "ano": 1876, "estantes": ["comece", "filosofia"], "resumo": "Texto curto e surpreendente sobre como o trabalho e o uso das mãos moldaram o cérebro, a linguagem e a própria espécie humana. Termina com um alerta sobre a destruição da natureza pelo lucro.", "link": "https://www.marxists.org/portugues/marx/1876/mes/macaco.htm", "fonte": "Marxists Internet Archive", "idioma": "pt", "destaque": false}, {"id": "abc-do-comunismo", "titulo": "ABC do Comunismo", "autor": "Nikolai Bukharin e Evgeni Preobrajenski", "ano": 1920, "estantes": ["comece", "revolucao"], "resumo": "Manual didático escrito logo depois da Revolução Russa para formar milhares de novos militantes. Explica o capitalismo, o programa comunista e os desafios da construção do socialismo.", "link": "https://www.marxists.org/portugues/bukharin/1920/abc/abc-do-comunismo.pdf", "fonte": "Marxists Internet Archive", "idioma": "pt", "destaque": false}, {"id": "o-capital-critica-da-economia-politica", "titulo": "O Capital: Crítica da Economia Política", "autor": "Karl Marx", "ano": 1867, "estantes": ["marxismo"], "resumo": "A obra central de Marx. Partindo da mercadoria, ele desmonta o funcionamento do capitalismo: o valor, a exploração do trabalho, a mais-valia, a acumulação e as crises. Leitura exigente, mas indispensável.", "link": "https://www.marxists.org/portugues/marx/1867/capital/index.htm", "fonte": "Marxists Internet Archive", "idioma": "pt", "destaque": true}, {"id": "manuscritos-economico-filosoficos", "titulo": "Manuscritos Econômico-Filosóficos", "autor": "Karl Marx", "ano": 1844, "estantes": ["marxismo", "filosofia"], "resumo": "Escritos de juventude em que Marx desenvolve a ideia de trabalho alienado: no capitalismo, o trabalhador se torna estranho ao que produz, à natureza, aos outros e a si mesmo.", "link": "https://www.marxists.org/portugues/marx/1844/manuscritos/index.htm", "fonte": "Marxists Internet Archive", "idioma": "pt", "destaque": false}, {"id": "miseria-da-filosofia", "titulo": "Miséria da Filosofia", "autor": "Karl Marx", "ano": 1847, "estantes": ["marxismo"], "resumo" racia alemã, onde Marx descreve as fases da sociedade comunista: de cada um segundo suas capacidades, a cada um segundo suas necessidades.", "link": "https://www.marxists.org/portugues/marx/1875/gotha/index.htm", "fonte": "Marxists Internet Archive", "idioma": "pt", "destaque": false}, {"id": "que-fazer", "titulo": "Que Fazer?", "autor": "Vladimir Lênin", "ano": 1902, "estantes": ["revolucao"], "resumo": "Debate sobre como organizar a luta: o papel do jornal operário, da consciência de classe e de um partido de revolucionários profissionais.", "link": "https://www.marxists.org/portugues/lenin/1902/quefazer/index.htm", "fonte": "Marxists Internet Archive", "idioma": "pt", "destaque": false}, {"id": "o-estado-e-a-revolucao", "titulo": "O Estado e a Revolução", "autor": "Vladimir Lênin", "ano": 1917, "estantes": ["revolucao"], "resumo": "Escrito às vésperas de Outubro, explica o que é o Estado, a quem ele serve e por que os trabalhadores precisam construir um poder próprio.", "link": "https://www.marxists.org/portugues/lenin/1917/08/estadoerevolucao/index.htm", "fonte": "Marxists Internet Archive", "idioma": "pt", "destaque": true}, {"id": "esquerdismo-doenca-infantil-do-comunismo", "titulo": "Esquerdismo, Doença Infantil do Comunismo", "autor": "Vladimir Lênin", "ano": 1920, "estantes": ["revolucao"], "resumo": "Lênin critica o sectarismo e defende a atuação nos sindicatos, nos parlamentos e em todas as organizações de massa.", "link": "https://www.marxists.org/portugues/lenin/1920/esquerdismo/index.htm", "fonte": "Marxists Internet Archive", "idioma": "pt", "destaque": false}, {"id": "reforma-ou-revolucao", "titulo": "Reforma ou Revolução?", "autor": "Rosa Luxemburgo", "ano": 1899, "estantes": ["revolucao"], "resumo": "Resposta clássica a quem acreditava que o socialismo chegaria aos poucos, só com reformas. Rosa mostra que reformas e revolução não se opõem, mas que as reformas sozinhas não acabam com a exploração.", "link": "https://www.marxists.org/portugues/luxemburgo/1900/ref_rev/index.htm", "fonte": "Marxists Internet Archive", "idioma": "pt", "destaque": true}, {"id": "greve-de-massas-partido-e-sindicatos", "titulo": "Greve de Massas, Partido e Sindicatos", "autor": "Rosa Luxemburgo", "ano": 1906, "estantes": ["revolucao"], "resumo": "A partir da Revolução Russa de 1905, Rosa analisa a força da greve geral e a relação entre espontaneidade das massas e organização.", "link": "https://www.marxists.org/portugues/luxemburgo/1906/mes/40.pdf", "fonte": "Marxists Internet Archive", "idioma": "pt", "destaque": false}, {"id": "a-revolucao-russa", "titulo": "A Revolução Russa", "autor": "Rosa Luxemburgo", "ano": 1918, "estantes": ["revolucao", "historia"], "resumo": "Escrito na prisão, defende a Revolução de Outubro e, ao mesmo tempo, critica os bolcheviques em nome da democracia operária.", "link": "https://www.marxists.org/portugues/luxemburgo/1918/mes/40.pdf", "fonte": "Marxists Internet Archive", "idioma": "pt", "destaque": false}, {"id": "a-revolucao-contra-o-capital", "titulo": "A Revolução contra O Capital", "autor": "Antonio Gramsci", "ano": 1917, "estantes": ["revolucao"], "resumo": "Artigo provocador em que o jovem Gramsci celebra a Revolução Russa como uma vitória da vontade coletiva contra leituras mecânicas do marxismo.", "link": "https://www.marxists.org/portugues/gramsci/1917/04/24.htm", "fonte": "Marxists Internet Archive", "idioma": "pt", "destaque": false, "pdf": "https://coletivolufa.github.io/livros/a-revolucao-contra-o-capital.pdf", "mb": 0.1}, {"id": "os-sertoes", "titulo": "Os Sertões", "autor": "Euclides da Cunha", "ano": 1902, "estantes": ["historia"], "resumo": "Relato monumental da Guerra de Canudos, em que o Exército massacrou a comunidade de Antônio Conselheiro no sertão da Bahia. Dividido em A Terra, O Homem e A Luta, termina como denúncia de um crime.", "link": "https://pt.wikisource.org/wiki/Os_Sert%C3%B5es", "fonte": "Wikisource", "idioma": "pt", "destaque": true, "pdf": "https://coletivolufa.github.io/livros/os-sertoes.pdf", "mb": 2.4}, {"id": "o-abolicionismo", "titulo": "O Abolicionismo", "autor": "Joaquim Nabuco", "ano": 1883, "estantes": ["historia"], "resumo": "Manifesto da campanha abolicionista, escrito no exílio. Nabuco mostra que a escravidão contaminava toda a sociedade brasileira e não bastava libertar: era preciso reparar.", "link": "https://pt.wikisource.org/wiki/O_Abolicionismo", "fonte": "Wikisource", "idioma": "pt", "destaque": false, "pdf": "https://coletivolufa.github.io/livros/o-abolicionismo.pdf", "mb": 1.0}, {"id": "minha-formacao", "titulo": "Minha Formação", "autor": "Joaquim Nabuco", "ano": 1900, "estantes": ["historia"], "resumo": "Memórias de Nabuco sobre sua educação, suas viagens e sua luta contra a escravidão, com o célebre capítulo Massangana.", "link": "https://www.gutenberg.org/ebooks/76030", "fonte": "Projeto Gutenberg", "idioma": "pt", "destaque": false, "pdf": "https://coletivolufa.github.io/livros/minha-formacao.pdf", "mb": 1.1}, {"id": "carta-de-pero-vaz-de-caminha", "titulo": "Carta de Pero Vaz de Caminha", "autor": "Pero Vaz de Caminha", "ano": 1500, "estantes": ["historia"], "resumo": "O primeiro documento escrito sobre a terra que viria a ser o Brasil. O escrivão descreve ao rei os povos indígenas e a paisagem com o olhar do colonizador.", "link": "https://pt.wikisource.org/wiki/Carta_de_Pero_Vaz_de_Caminha", "fonte": "Wikisource", "idioma": "pt", "destaque": false, "pdf": "https://coletivolufa.github.io/livros/carta-de-pero-vaz-de-caminha.pdf", "mb": 0.2}, {"id": "cultura-e-opulencia-do-brasil-por-suas-drogas-e-minas", "titulo": "Cultura e Opulência do Brasil por suas Drogas e Minas", "autor": "André João Antonil", "ano": 1711, "estantes": ["historia", "marxismo"], "resumo": "Retrato detalhado da economia colonial: engenhos de açúcar, plantações de tabaco, minas de ouro e o trabalho escravizado que sustentava tudo. Foi proibido pela Coroa portuguesa logo após publicado.", "link": "https://www.gutenberg.org/ebooks/70662", "fonte": "Projeto Gutenberg", "idioma": "pt", "destaque": false, "pdf": "https://coletivolufa.github.io/livros/cultura-e-opulencia-do-brasil-por-suas-drogas-e-minas.pdf", "mb": 0.9}, {"id": "dez-dias-que-abalaram-o-mundo", "titulo": "Dez Dias que Abalaram o Mundo", "autor": "John Reed", "ano": 1919, "estantes": ["historia", "revolucao"], "resumo": "A grande reportagem da Revolução Russa. Reed esteve nas ruas, nos sovietes e no Palácio de Inverno e conta, dia a dia, como os trabalhadores tomaram o poder.", "link": "https://www.marxists.org/portugues/reed/1919/dias/index.htm", "fonte": "Marxists Internet Archive", "idioma": "pt", "destaque": true}, {"id": "as-lutas-de-classes-em-franca-de-1848-a-1850", "titulo": "As Lutas de Classes em França de 1848 a 1850", "autor": "Karl Marx", "ano": 1850, "estantes": ["historia"], "resumo": "A revolução de 1848 em Paris analisada classe por classe: como os trabalhadores foram derrotados e a burguesia se reorganizou.", "link": "https://www.marxists.org/portugues/marx/1850/11/lutas_class/index.htm", "fonte": "Marxists Internet Archive", "idioma": "pt", "destaque": false}, {"id": "o-18-de-brumario-de-luis-bonaparte", "titulo": "O 18 de Brumário de Luís Bonaparte", "autor": "Karl Marx", "ano": 1852, "estantes": ["historia", "filosofia"], "resumo": "Como um golpe de Estado acontece. Marx analisa o golpe de Luís Bonaparte e cunha frases célebres, como a da história que se repete, primeiro como tragédia, depois como farsa.", "link": "https://www.marxists.org/portugues/marx/1852/brumario/index.htm", "fonte": "Marxists Internet Archive", "idioma": "pt", "destaque": true}, {"id": "teses-sobre-feuerbach", "titulo": "Teses sobre Feuerbach", "autor": "Karl Marx", "ano": 1845, "estantes": ["filosofia"], "resumo": "Onze teses curtíssimas. A última virou a frase mais citada de Marx: os filósofos apenas interpretaram o mundo de diferentes maneiras; o que importa é transformá-lo.", "link": "https://www.marxists.org/portugues/marx/1845/tesfeuer.htm", "fonte": "Marxists Internet Archive", "idioma": "pt", "destaque": false, "pdf": "https://coletivolufa.github.io/livros/teses-sobre-feuerbach.pdf", "mb": 0.1}, {"id": "a-ideologia-alema-capitulo-i", "titulo": "A Ideologia Alemã (capítulo I)", "autor": "Karl Marx e Friedrich Engels", "ano": 1846, "estantes": ["filosofia"], "resumo": "O primeiro capítulo, dedicado a Feuerbach, onde nasce a concepção materialista da história: não é a consciência que determina a vida, mas a vida que determina a consciência.", "link": "https://www.marxists.org/portugues/marx/1845/ideologia-alema-oe/index.htm", "fonte": "Marxists Internet Archive", "idioma": "pt", "destaque": false}, {"id": "anti-duhring", "titulo": "Anti-Dühring", "autor": "Friedrich Engels", "ano": 1878, "estantes": ["filosofia"], "resumo": "Uma visão de conjunto do marxismo, em filosofia, economia e socialismo, escrita como resposta a um professor que pretendia reinventar o socialismo.", "link": "https://www.marxists.org/portugues/marx/1877/antiduhring/index.htm", "fonte": "Marxists Internet Archive", "idioma": "pt", "destaque": false}, {"id": "ludwig-feuerbach-e-o-fim-da-filosofia-classica-alema", "titulo": "Ludwig Feuerbach e o Fim da Filosofia Clássica Alemã", "autor": "Friedrich Engels", "ano": 1886, "estantes": ["filosofia"], "resumo": "Engels explica o que o marxismo herdou de Hegel e de Feuerbach e o que precisou superar.", "link": "https://www.marxists.org/portugues/marx/1886/mes/fim.htm", "fonte": "Marxists Internet Archive", "idioma": "pt", "destaque": false}, {"id": "o-papel-do-individuo-na-historia", "titulo": "O Papel do Indivíduo na História", "autor": "Gueorgui Plekhanov", "ano": 1898, "estantes": ["filosofia", "historia"], "resumo": "Grandes líderes fazem a história ou são feitos por ela? Plekhanov responde a partir do materialismo, sem negar o papel das pessoas.", "link": "https://www.marxists.org/portugues/plekhanov/1898/mes/papel.htm", "fonte": "Marxists Internet Archive", "idioma": "pt", "destaque": false}, {"id": "a-teoria-do-materialismo-historico", "titulo": "A Teoria do Materialismo Histórico", "autor": "Nikolai Bukharin", "ano": 1921, "estantes": ["filosofia"], "resumo": "Manual de sociologia marxista escrito para a formação de quadros nos primeiros anos da União Soviética.", "link": "https://www.marxists.org/portugues/bukharin/1921/teoria/index.htm", "fonte": "Marxists Internet Archive", "idioma": "pt", "destaque": false}, {"id": "a-republica", "titulo": "A República", "autor": "Platão", "ano": -375, "estantes": ["filosofia"], "resumo": "O diálogo mais famoso de Platão discute o que é a justiça e imagina uma cidade ideal governada por filósofos. Traz a alegoria da caverna.", "link": "https://www.gutenberg.org/ebooks/150", "fonte": "Projeto Gutenberg", "idioma": "en", "destaque": false, "pdf": "https://coletivolufa.github.io/livros/a-republica.pdf", "mb": 1.7}, {"id": "utopia", "titulo": "Utopia", "autor": "Thomas More", "ano": 1516, "estantes": ["filosofia", "revolucao"], "resumo": "More imagina uma ilha onde não há propriedade privada nem dinheiro e todos trabalham poucas horas. O livro deu nome a todo sonho de sociedade igualitária.", "link": "https://www.gutenberg.org/ebooks/2130", "fonte": "Projeto Gutenberg", "idioma": "en", "destaque": false, "pdf": "https://coletivolufa.github.io/livros/utopia.pdf", "mb": 0.7}, {"id": "a-origem-da-familia-da-propriedade-privada-e-do-estado", "titulo": "A Origem da Família, da Propriedade Privada e do Estado", "autor": "Friedrich Engels", "ano": 1884, "estantes": ["feminismo", "filosofia"], "resumo": "Engels investiga como surgiram a propriedade privada, o Estado e a família patriarcal, e mostra que a opressão da mulher tem origem histórica e não natural.", "link": "https://www.marxists.org/portugues/marx/1884/origem/index.htm", "fonte": "Marxists Internet Archive", "idioma": "pt", "destaque": true, "pdf": "https://coletivolufa.github.io/livros/a-origem-da-familia-da-propriedade-privada-e-do-estado.pdf", "mb"       return { nome: e.nome, descricao: e.descricao, n: n, ativa: ativa, inativa: !ativa, escolher: function () { self.setState({ estante: e.id, limite: 12 }); } };
    }).filter(function (e) { return e.n > 0 || e.ativa; });
    var limite = st.limite || 12;
    var livros = filtrados.slice(0, limite).map(function (l) {
      return {
        titulo: l.titulo, autor: l.autor, ano: l.ano, resumo: l.resumo, link: l.link, fonte: l.fonte,
        estantesTexto: l.estantes.map(function (e) { return nomeEstante[e]; }).join(' · '),
        ingles: l.idioma === 'en', temPdf: !!l.pdf, pdf: l.pdf || '',
        mbTexto: l.mb ? String(l.mb).replace('.', ',') + ' MB' : 'PDF'
      };
    });
    var temFiltros = !!(palavras.length || estante !== 'todas' || cursoAtual);
    return {
      c: c, escuro: escuro, claro: !escuro,
      temaTexto: escuro ? 'Claro' : 'Escuro',
      temaLabel: escuro ? 'Mudar para o tema claro' : 'Mudar para o tema escuro',
      alternarTema: function () {
        var novo = !escuro;
        self.setState({ escuro: novo });
        try { window.localStorage.setItem('tc-tema', novo ? 'escuro' : 'claro'); } catch (e) {}
      },
      cursos: cursos, estantes: estantes, livros: livros,
      q: st.q || '',
      onQ: function (e) { self.setState({ q: e.target.value, limite: 12 }); },
      limpar: function () { self.setState({ q: '', estante: 'todas', curso: null, limite: 12 }); },
      mostrarMais: function () { self.setState({ limite: limite + 12 }); },
      temMais: filtrados.length > limite, restantes: filtrados.length - limite,
      temCurso: !!cursoAtual, cursoNome: cursoAtual ? cursoAtual[0] : '',
      temFiltros: temFiltros, vazio: filtrados.length === 0,
      contagem: temFiltros ? filtrados.length + ' de ' + ac.livros.length + ' livros' : ac.livros.length + ' livros'
    };
  }
}
iniciarPagina(Component, {"tema": "claro"});
