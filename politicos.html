<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { escuro: null };
  }
  componentDidMount() {
    try {
      var v = window.localStorage.getItem('tc-tema');
      if (v === 'escuro' || v === 'claro') this.setState({ escuro: v === 'escuro' });
    } catch (e) {}
  }
  renderVals() {
    var escuro = (this.state && this.state.escuro !== null && this.state.escuro !== undefined)
      ? this.state.escuro
      : (this.props.tema ?? 'claro') === 'escuro';
    var self = this;
    var c = escuro
      ? { bg: '#060308', surface: '#302D29', ink: '#F2EEE9', muted: '#DED5CA', line: 'rgba(222, 213, 202, 0.3)' }
      : { bg: '#F2EEE9', surface: '#DED5CA', ink: '#060308', muted: '#302D29', line: 'rgba(48, 45, 41, 0.28)' };
    return {
      menuAberto: !!(this.state && this.state.menuAberto),
      menuFechado: !(this.state && this.state.menuAberto),
      menuAbertoTxt: (this.state && this.state.menuAberto) ? 'true' : 'false',
      alternarMenu: (function (eu) { return function () { eu.setState({ menuAberto: !(eu.state && eu.state.menuAberto) }); }; })(this),
      fecharMenu: (function (eu) { return function () { eu.setState({ menuAberto: false }); }; })(this),
      c: c,
      escuro: escuro,
      claro: !escuro,
      temaTexto: escuro ? 'Claro' : 'Escuro',
      temaLabel: escuro ? 'Mudar para o tema claro' : 'Mudar para o tema escuro',
      alternarTema: function () {
        var novo = !escuro;
        self.setState({ escuro: novo });
        try { window.localStorage.setItem('tc-tema', novo ? 'escuro' : 'claro'); } catch (e) {}
      }
    };
  }
}
iniciarPagina(Component, {"tema": "claro"});
</script>
