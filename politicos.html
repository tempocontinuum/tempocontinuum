<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tempo Continuum — Políticos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&amp;display=swap">
<style>
body{margin:0;font-family:"Gotham Medium","Gotham","GothamMedium","Montserrat","Helvetica Neue",Arial,sans-serif;font-weight:500}
h1,h2,h3,h4,p{font-weight:500}
a{color:inherit}a:hover{text-decoration-thickness:2px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid currentColor;outline-offset:3px}
@media (max-width: 760px){
.tc-header-row{flex-wrap:nowrap !important;gap:8px !important;padding:10px 16px !important}
.tc-nav,.tc-buscar{display:none !important}
.tc-logo{margin-right:auto;min-width:0}
.tc-tema-txt{display:none}
.tc-tema{padding:8px 12px !important}
.tc-menu-btn{display:flex !important}
.tc-painel{display:block !important}
.tc-chips{flex-wrap:nowrap !important;overflow-x:auto;padding-bottom:8px;margin-right:-16px;padding-right:16px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tc-chips>*{flex:none}
main{padding-left:16px !important;padding-right:16px !important;gap:32px !important}
footer>div{padding-left:16px !important;padding-right:16px !important}
}
</style>
<style>html,body{margin:0} #app > div{min-height:100vh}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="background: {{c.bg}}; color: {{c.ink}}; min-height: 100%; font-family: &quot;Gotham Medium&quot;, &quot;Gotham&quot;, &quot;Montserrat&quot;, Arial, sans-serif; font-weight: 500;">

  <header style="background: {{c.bg}}; color: {{c.ink}}; border-bottom: 2px solid {{c.ink}};">
    <div class="tc-header-row" style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 40px;">
      <a class="tc-logo" href="index.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit;" aria-label="Tempo Continuum, início">
        <sc-if value="{{claro}}" hint-placeholder-val="{{true}}"><img src="logos/logo-claro.png" alt="" width="48" height="48" style="display: block; width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: none;"></sc-if><sc-if value="{{escuro}}" hint-placeholder-val="{{false}}"><img src="logos/logo-escuro.png" alt="" width="48" height="48" style="display: block; width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: none;"></sc-if>
        <span style="font-size: 13px; line-height: 1.05; letter-spacing: 0.08em; text-transform: uppercase;">Tempo<br>Continuum</span>
      </a>
      <nav class="tc-nav" aria-label="Seções" style="display: flex; flex-wrap: wrap; gap: 6px 8px; flex: 1 1 560px; font-size: 15px;">
        <a href="noticias.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Notícias</a>
        <a href="politicos.html" aria-current="page" style="text-decoration: none; padding: 8px 14px; border-radius: 999px; background: #8EA612; color: #060308;">Políticos</a>
        <a href="casos.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Casos</a>
        <a href="documentarios.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Documentários</a>
        <a href="dossies.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Dossiês</a>
        <a href="cursos.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Cursos</a>
        <a href="ferramentas.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Ferramentas</a>
      </nav>
      <a class="tc-buscar" href="noticias.html" style="display: flex; align-items: center; gap: 8px; text-decoration: none; border: 2px solid {{c.ink}}; border-radius: 999px; padding: 8px 16px; font-size: 14px; min-height: 44px; box-sizing: border-box;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Buscar</a>
      <button type="button" class="tc-tema" onClick="{{alternarTema}}" aria-label="{{temaLabel}}" style="display: flex; align-items: center; gap: 8px; font: inherit; font-size: 14px; border: 2px solid {{c.ink}}; background: {{c.ink}}; color: {{c.bg}}; border-radius: 999px; padding: 8px 16px; min-height: 44px; box-sizing: border-box; cursor: pointer;">
        <sc-if value="{{claro}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></sc-if>
        <sc-if value="{{escuro}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
        <span class="tc-tema-txt">{{temaTexto}}</span>
      </button>
      <button type="button" class="tc-menu-btn" onClick="{{alternarMenu}}" aria-expanded="{{menuAbertoTxt}}" aria-controls="tc-painel" style="display: none; align-items: center; gap: 8px; font: inherit; font-size: 14px; border: 2px solid {{c.ink}}; background: transparent; color: {{c.ink}}; border-radius: 999px; padding: 8px 14px; min-height: 44px; box-sizing: border-box; cursor: pointer;">
        <sc-if value="{{menuFechado}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></sc-if>
        <sc-if value="{{menuAberto}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></sc-if>
        Menu
      </button>
    </div>
    <sc-if value="{{menuAberto}}" hint-placeholder-val="{{false}}">
      <nav id="tc-painel" class="tc-painel" aria-label="Menu" style="display: none; border-top: 1px solid {{c.line}}; padding: 4px 16px 12px;">
        <a href="index.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Início</a>
        <a href="noticias.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Notícias</a>
        <a href="politicos.html" aria-current="page" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}}; background: #8EA612; color: #060308;">Políticos</a>
        <a href="casos.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Casos</a>
        <a href="documentarios.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Documentários</a>
        <a href="dossies.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Dossiês</a>
        <a href="cursos.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Cursos</a>
        <a href="ferramentas.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Ferramentas</a>
        <a href="noticias.html" onClick="{{fecharMenu}}" style="text-decoration: none; display: flex; align-items: center; gap: 10px; padding: 14px 12px; font-size: 18px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Buscar</a>
      </nav>
    </sc-if>
  </header>

  <main style="max-width: 1240px; margin: 0 auto; padding: 32px 24px 80px; display: flex; flex-direction: column; gap: 40px;">
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <p style="margin: 0; font-size: 13px; color: {{c.muted}};"><a href="index.html" style="text-underline-offset: 3px;">Início</a> / Políticos</p>
      <h1 style="margin: 0; font-size: clamp(2.4rem, 5vw, 3.6rem); line-height: 1; letter-spacing: -0.02em;"><span style="background: #8EA612; color: #060308; padding: 0 10px;">Políticos</span></h1>
      <p style="margin: 0; font-size: 1.1rem; line-height: 1.55; color: {{c.muted}}; max-width: 60ch;">Perfis com votações, declarações públicas e os casos em que cada político aparece.</p>
    </div>

    <form onSubmit="{{evitarEnvio}}" style="display: flex; flex-direction: column; gap: 14px; border-top: 2px solid {{c.ink}}; border-bottom: 1px solid {{c.line}}; padding: 20px 0;">
      <label for="pq" style="font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: {{c.muted}};">Buscar por nome</label>
      <input id="pq" type="search" value="{{q}}" onInput="{{onQ}}" placeholder="Nome, partido ou estado" autocomplete="off" style="max-width: 520px; font: inherit; font-size: 16px; padding: 12px 14px; border: 2px solid {{c.ink}}; background: {{c.surface}}; color: {{c.ink}}; border-radius: 0;">
      <div class="tc-chips" role="group" aria-label="Filtrar por cargo" style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px;">
        <sc-for list="{{filtros}}" as="fl"><sc-if value="{{fl.ativo}}"><button type="button" onClick="{{fl.escolher}}" aria-pressed="true" style="font: inherit; cursor: pointer; padding: 6px 12px; border-radius: 999px; background: #8EA612; color: #060308; border: 1.5px solid #8EA612;">{{fl.nome}}</button></sc-if><sc-if value="{{fl.inativo}}"><button type="button" onClick="{{fl.escolher}}" aria-pressed="false" style="font: inherit; cursor: pointer; padding: 6px 12px; border-radius: 999px; background: transparent; color: {{c.ink}}; border: 1.5px solid {{c.line}};">{{fl.nome}}</button></sc-if></sc-for>
      </div>
    </form>

    <sc-if value="{{carregando}}"><p style="margin: 0; color: {{c.muted}};">Carregando fichas…</p></sc-if>
    <sc-if value="{{erro}}"><p style="margin: 0; color: {{c.muted}};">Não foi possível carregar as fichas agora. Tente recarregar a página.</p></sc-if>
    <sc-if value="{{vazio}}">
      <div style="display: flex; flex-direction: column; gap: 12px; align-items: flex-start;">
        <p style="margin: 0; font-size: 1.05rem;">Nenhuma ficha encontrada com esses filtros.</p>
        <button type="button" onClick="{{limpar}}" style="font: inherit; cursor: pointer; background: transparent; color: {{c.ink}}; border: 2px solid {{c.ink}}; padding: 10px 18px; font-size: 14px;">Limpar busca</button>
      </div>
    </sc-if>

    <sc-if value="{{temLista}}">
    <p style="margin: 0; font-size: 13px; color: {{c.muted}};" aria-live="polite">{{contagem}}</p>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px;">
      <sc-for list="{{lista}}" as="p">
      <article style="background: {{c.surface}}; border: 1px solid {{c.line}}; padding: 20px; display: flex; flex-direction: column; gap: 12px;">
        <sc-if value="{{p.temFoto}}"><img src="{{p.foto}}" alt="" width="72" height="72" style="width: 72px; height: 72px; border-radius: 50%; object-fit: cover;"></sc-if>
        <sc-if value="{{p.semFoto}}"><div aria-hidden="true" style="width: 72px; height: 72px; border-radius: 50%; background: #8EA612; color: #060308; display: flex; align-items: center; justify-content: center; font-size: 1.4rem;">{{p.iniciais}}</div></sc-if>
        <h2 style="margin: 0; font-size: 1.15rem;">{{p.nome}}</h2>
        <p style="margin: 0; font-size: 0.85rem; color: {{c.muted}};">{{p.linha}}</p>
        <sc-if value="{{p.temChamada}}"><p style="margin: 0; font-size: 0.85rem;">{{p.chamada}}</p></sc-if>
        <a href="{{p.link}}" style="font-size: 14px; text-underline-offset: 4px; margin-top: auto;">Ver ficha<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);"> de {{p.nome}}</span></a>
      </article>
      </sc-for>
    </div>
    <sc-if value="{{temMais}}"><button type="button" onClick="{{mostrarMais}}" style="align-self: center; font: inherit; cursor: pointer; background: transparent; color: {{c.ink}}; border: 2px solid {{c.ink}}; padding: 12px 24px; font-size: 14px;">Carregar mais perfis ({{restantes}})</button></sc-if>
    </sc-if>
  </main>

  <footer style="background: #060308; color: #F2EEE9; border-top: 1px solid {{c.line}};">
    <div style="max-width: 1240px; margin: 0 auto; padding: 48px 24px 40px; display: flex; flex-wrap: wrap; gap: 40px; justify-content: space-between;">
      <div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 12px;">
        <p style="margin: 0; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;">Tempo Continuum</p>
        <p style="margin: 0; font-size: 1.4rem; line-height: 1.25; max-width: 24ch;"><span style="background: #8EA612; color: #060308; padding: 0 6px; box-decoration-break: clone; -webkit-box-decoration-break: clone;">Conhecer o passado. Organizar o presente. Construir o futuro.</span></p>
      </div>
      <nav aria-label="Rodapé" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 40px; font-size: 14px; align-content: start;">
        <a href="noticias.html" style="text-decoration: none;">Notícias</a>
        <a href="dossies.html" style="text-decoration: none;">Dossiês</a>
        <a href="politicos.html" style="text-decoration: none;">Políticos</a>
        <a href="cursos.html" style="text-decoration: none;">Cursos</a>
        <a href="casos.html" style="text-decoration: none;">Casos</a>
        <a href="index.html" style="text-decoration: none;">Início</a>
        <a href="documentarios.html" style="text-decoration: none;">Documentários</a>
        <a href="ferramentas.html" style="text-decoration: none;">Ferramentas</a>
      </nav>
    </div>
  </footer>
</div>
</template>
<script src="js/runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { escuro: null, status: 'carregando', fichas: [], q: '', filtro: 'todos', limite: 12 };
  }
  componentDidMount() {
    var self = this;
    try {
      var v = window.localStorage.getItem('tc-tema');
      if (v === 'escuro' || v === 'claro') this.setState({ escuro: v === 'escuro' });
    } catch (e) {}
    fetch('dados/politicos.json', { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (l) { self.setState({ fichas: Array.isArray(l) ? l : [], status: 'ok' }); })
      .catch(function () { self.setState({ status: 'erro' }); });
  }
  filtros() {
    return [['todos', 'Todos os cargos'], ['Presidente', 'Presidente'], ['Senador', 'Senadores'], ['Deputado federal', 'Deputados federais'], ['Governador', 'Governadores'], ['Prefeito', 'Prefeitos'], ['outros', 'Outros cargos']];
  }
  lista() {
    var st = this.state || {};
    var norm = function (s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); };
    var fixos = this.filtros().map(function (f) { return f[0]; });
    var palavras = norm(st.q).split(/\s+/).filter(Boolean);
    var filtro = st.filtro || 'todos';
    return (st.fichas || []).filter(function (f) {
      if (filtro === 'outros' && fixos.indexOf(f.categoria) >= 0) return false;
      if (filtro !== 'todos' && filtro !== 'outros' && f.categoria !== filtro) return false;
      var t = norm([f.nome, f.partido, f.uf, f.cargo_curto, f.categoria].join(' '));
      return palavras.every(function (w) { return t.indexOf(w) >= 0; });
    });
  }
  renderVals() {
    var escuro = (this.state && this.state.escuro !== null && this.state.escuro !== undefined)
      ? this.state.escuro
      : (this.props.tema ?? 'claro') === 'escuro';
    var self = this;
    var c = escuro
      ? { bg: '#060308', surface: '#302D29', ink: '#F2EEE9', muted: '#DED5CA', line: 'rgba(222, 213, 202, 0.3)' }
      : { bg: '#F2EEE9', surface: '#DED5CA', ink: '#060308', muted: '#302D29', line: 'rgba(48, 45, 41, 0.28)' };
    var st = this.state || {};
    var rel = function (u) { u = String(u || '').trim(); return /^https?:/i.test(u) ? u : u.replace(/^\/+/, '').replace(/^tempocontinuum\//, ''); };
    var filtrados = this.lista();
    var limite = st.limite || 12;
    var fichas = st.fichas || [];
    var fixos = this.filtros().map(function (f) { return f[0]; });
    var temOutros = fichas.some(function (f) { return fixos.indexOf(f.categoria) < 0; });
    var filtro = st.filtro || 'todos';
    var filtros = this.filtros().filter(function (f) { return f[0] !== 'outros' || temOutros || filtro === 'outros'; }).map(function (f) {
      var ativo = f[0] === filtro;
      return { nome: f[1], ativo: ativo, inativo: !ativo, escolher: function () { self.setState({ filtro: f[0], limite: 12 }); } };
    });
    var lista = filtrados.slice(0, limite).map(function (f) {
      return {
        nome: f.nome, iniciais: f.iniciais || '', foto: rel(f.foto), temFoto: !!f.foto, semFoto: !f.foto,
        linha: [f.cargo_curto, f.partido, f.uf].filter(Boolean).join(' · '),
        chamada: f.chamada || '', temChamada: !!f.chamada,
        link: 'ficha.html?id=' + encodeURIComponent(f.id)
      };
    });
    var ok = st.status === 'ok';
    return {
      carregando: st.status === 'carregando', erro: st.status === 'erro',
      vazio: ok && filtrados.length === 0, temLista: ok && filtrados.length > 0,
      contagem: filtrados.length === 1 ? '1 ficha' : filtrados.length + ' fichas',
      lista: lista, filtros: filtros, q: st.q || '',
      onQ: function (e) { self.setState({ q: e.target.value, limite: 12 }); },
      evitarEnvio: function (e) { e.preventDefault(); },
      limpar: function () { self.setState({ q: '', filtro: 'todos', limite: 12 }); },
      temMais: filtrados.length > limite, restantes: filtrados.length - limite,
      mostrarMais: function () { self.setState({ limite: limite + 12 }); },
      menuAberto: !!(this.state && this.state.menuAberto),
      menuFechado: !(this.state && this.state.menuAberto),
      menuAbertoTxt: (this.state && this.state.menuAberto) ? 'true' : 'false',
      alternarMenu: (function (eu) { return function () { eu.setState({ menuAberto: !(eu.state && eu.state.menuAberto) }); }; })(this),
      fecharMenu: (function (eu) { return function () { eu.setState({ menuAberto: false }); }; })(this),
      c: c,
      escuro: escuro,
      claro: !escuro,
      temaTexto: escuro ? 'Claro' : 'Escuro',
      temaLabel: escuro ? 'Mudar para o tema claro' : 'Mudar para o tema escuro',
      alternarTema: function () {
        var novo = !escuro;
        self.setState({ escuro: novo });
        try { window.localStorage.setItem('tc-tema', novo ? 'escuro' : 'claro'); } catch (e) {}
      }
    };
  }
}
iniciarPagina(Component, {"tema": "claro"});
</script>
</body>
</html>
