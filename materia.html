<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tempo Continuum — Matéria</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&amp;display=swap">
<style>
body{margin:0;font-family:"Gotham Medium","Gotham","GothamMedium","Montserrat","Helvetica Neue",Arial,sans-serif;font-weight:500}
h1,h2,h3,h4,p{font-weight:500}
a{color:inherit}a:hover{text-decoration-thickness:2px}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid currentColor;outline-offset:3px}
@media (max-width: 760px){
.tc-header-row{flex-wrap:nowrap !important;gap:8px !important;padding:10px 16px !important}
.tc-nav,.tc-buscar{display:none !important}
.tc-logo{margin-right:auto;min-width:0}
.tc-tema-txt{display:none}
.tc-tema{padding:8px 12px !important}
.tc-menu-btn{display:flex !important}
.tc-painel{display:block !important}
.tc-chips{flex-wrap:nowrap !important;overflow-x:auto;padding-bottom:8px;margin-right:-16px;padding-right:16px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tc-chips>*{flex:none}
main{padding-left:16px !important;padding-right:16px !important;gap:32px !important}
footer>div{padding-left:16px !important;padding-right:16px !important}
}
</style>
<style>html,body{margin:0} #app > div{min-height:100vh}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div style="background: {{c.bg}}; color: {{c.ink}}; min-height: 100%; font-family: &quot;Gotham Medium&quot;, &quot;Gotham&quot;, &quot;Montserrat&quot;, Arial, sans-serif; font-weight: 500;">

  <header style="background: {{c.bg}}; color: {{c.ink}}; border-bottom: 2px solid {{c.ink}};">
    <div class="tc-header-row" style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 40px;">
      <a class="tc-logo" href="index.html" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: inherit;" aria-label="Tempo Continuum, início">
        <sc-if value="{{claro}}" hint-placeholder-val="{{true}}"><img src="logos/logo-claro.png" alt="" width="48" height="48" style="display: block; width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: none;"></sc-if><sc-if value="{{escuro}}" hint-placeholder-val="{{false}}"><img src="logos/logo-escuro.png" alt="" width="48" height="48" style="display: block; width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: none;"></sc-if>
        <span style="font-size: 13px; line-height: 1.05; letter-spacing: 0.08em; text-transform: uppercase;">Tempo<br>Continuum</span>
      </a>
      <nav class="tc-nav" aria-label="Seções" style="display: flex; flex-wrap: wrap; gap: 6px 8px; flex: 1 1 560px; font-size: 15px;">
        <a href="noticias.html" aria-current="page" style="text-decoration: none; padding: 8px 14px; border-radius: 999px; background: #8EA612; color: #060308;">Notícias</a>
        <a href="politicos.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Políticos</a>
        <a href="casos.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Casos</a>
        <a href="documentarios.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Documentários</a>
        <a href="dossies.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Dossiês</a>
        <a href="cursos.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Cursos</a>
        <a href="ferramentas.html" style="text-decoration: none; padding: 8px 14px; border-radius: 999px;">Ferramentas</a>
      </nav>
      <a class="tc-buscar" href="#busca" style="display: flex; align-items: center; gap: 8px; text-decoration: none; border: 2px solid {{c.ink}}; border-radius: 999px; padding: 8px 16px; font-size: 14px; min-height: 44px; box-sizing: border-box;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Buscar</a>
      <button type="button" class="tc-tema" onClick="{{alternarTema}}" aria-label="{{temaLabel}}" style="display: flex; align-items: center; gap: 8px; font: inherit; font-size: 14px; border: 2px solid {{c.ink}}; background: {{c.ink}}; color: {{c.bg}}; border-radius: 999px; padding: 8px 16px; min-height: 44px; box-sizing: border-box; cursor: pointer;">
        <sc-if value="{{claro}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></sc-if>
        <sc-if value="{{escuro}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
        <span class="tc-tema-txt">{{temaTexto}}</span>
      </button>
      <button type="button" class="tc-menu-btn" onClick="{{alternarMenu}}" aria-expanded="{{menuAbertoTxt}}" aria-controls="tc-painel" style="display: none; align-items: center; gap: 8px; font: inherit; font-size: 14px; border: 2px solid {{c.ink}}; background: transparent; color: {{c.ink}}; border-radius: 999px; padding: 8px 14px; min-height: 44px; box-sizing: border-box; cursor: pointer;">
        <sc-if value="{{menuFechado}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></sc-if>
        <sc-if value="{{menuAberto}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></sc-if>
        Menu
      </button>
    </div>
    <sc-if value="{{menuAberto}}" hint-placeholder-val="{{false}}">
      <nav id="tc-painel" class="tc-painel" aria-label="Menu" style="display: none; border-top: 1px solid {{c.line}}; padding: 4px 16px 12px;">
        <a href="index.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Início</a>
        <a href="noticias.html" aria-current="page" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}}; background: #8EA612; color: #060308;">Notícias</a>
        <a href="politicos.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Políticos</a>
        <a href="casos.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Casos</a>
        <a href="documentarios.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Documentários</a>
        <a href="dossies.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Dossiês</a>
        <a href="cursos.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Cursos</a>
        <a href="ferramentas.html" style="text-decoration: none; display: block; padding: 14px 12px; font-size: 18px; border-bottom: 1px solid {{c.line}};">Ferramentas</a>
        <a href="#busca" onClick="{{fecharMenu}}" style="text-decoration: none; display: flex; align-items: center; gap: 10px; padding: 14px 12px; font-size: 18px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Buscar</a>
      </nav>
    </sc-if>
  </header>

  <main style="max-width: 760px; margin: 0 auto; padding: 32px 24px 80px; display: flex; flex-direction: column; gap: 28px;">
    <p style="margin: 0; font-size: 13px; color: {{c.muted}};"><a href="index.html" style="text-underline-offset: 3px;">Início</a> / <a href="noticias.html" style="text-underline-offset: 3px;">Notícias</a> / Matéria</p>

    <sc-if value="{{carregando}}" hint-placeholder-val="{{false}}">
      <p role="status" style="margin: 0; font-size: 1.1rem; color: {{c.muted}};">Carregando a matéria…</p>
    </sc-if>

    <sc-if value="{{naoEncontrada}}" hint-placeholder-val="{{false}}">
      <div style="border: 1.5px dashed {{c.line}}; padding: 28px 24px; display: flex; flex-direction: column; gap: 10px;">
        <strong style="font-size: 1.3rem; font-weight: 500;">Matéria não encontrada</strong>
        <span style="color: {{c.muted}};">Ela pode ter sido tirada do ar ou o endereço está incompleto.</span>
        <a href="noticias.html" style="align-self: flex-start; text-underline-offset: 3px;">Ver todas as notícias</a>
      </div>
    </sc-if>

    <sc-if value="{{temMateria}}" hint-placeholder-val="{{true}}">
      <article style="display: flex; flex-direction: column; gap: 22px;">
        <header style="display: flex; flex-direction: column; gap: 16px;">
          <div style="display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 13px; color: {{c.muted}};">
            <span style="background: #8EA612; color: #060308; padding: 3px 10px; letter-spacing: 0.08em; text-transform: uppercase; font-size: 12px;">{{m.editoria}}</span>
            <span>{{m.dataTexto}}</span>
            <sc-if value="{{m.temAutor}}" hint-placeholder-val="{{true}}"><span>· {{m.autor}}</span></sc-if>
          </div>
          <h1 style="margin: 0; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.08; letter-spacing: -0.02em; text-wrap: balance;">{{m.titulo}}</h1>
          <sc-if value="{{m.temLinha}}" hint-placeholder-val="{{true}}"><p style="margin: 0; font-size: 1.2rem; line-height: 1.5; color: {{c.muted}};">{{m.linha}}</p></sc-if>
        </header>

        <sc-if value="{{m.temFoto}}" hint-placeholder-val="{{false}}">
          <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px;">
            <img src="{{m.foto}}" alt="{{m.legenda}}" style="display: block; width: 100%; height: auto; border: 1px solid {{c.line}}; box-sizing: border-box;">
            <figcaption style="font-size: 13px; line-height: 1.45; color: {{c.muted}};">{{m.legenda}}<sc-if value="{{m.temCredito}}" hint-placeholder-val="{{false}}"> · Foto: {{m.credito}}</sc-if></figcaption>
          </figure>
        </sc-if>

        <div style="display: flex; flex-direction: column; gap: 18px; font-size: 1.08rem; line-height: 1.7;">
          <sc-for list="{{blocos}}" as="b" hint-placeholder-count="4">
            <sc-if value="{{b.h2}}" hint-placeholder-val="{{false}}"><h2 style="margin: 12px 0 0; font-size: 1.5rem; line-height: 1.2;"><sc-for list="{{b.segs}}" as="g" hint-placeholder-count="1"><sc-if value="{{g.link}}" hint-placeholder-val="{{false}}"><a href="{{g.href}}" target="{{g.alvo}}" rel="noopener noreferrer" style="text-underline-offset: 3px;">{{g.t}}</a></sc-if><sc-if value="{{g.forte}}" hint-placeholder-val="{{false}}"><strong style="font-weight: 500; background: {{c.surface}}; padding: 0 2px;">{{g.t}}</strong></sc-if><sc-if value="{{g.enfase}}" hint-placeholder-val="{{false}}"><em>{{g.t}}</em></sc-if><sc-if value="{{g.simples}}" hint-placeholder-val="{{true}}">{{g.t}}</sc-if></sc-for></h2></sc-if>
            <sc-if value="{{b.h3}}" hint-placeholder-val="{{false}}"><h3 style="margin: 8px 0 0; font-size: 1.2rem; line-height: 1.25;"><sc-for list="{{b.segs}}" as="g" hint-placeholder-count="1"><sc-if value="{{g.link}}" hint-placeholder-val="{{false}}"><a href="{{g.href}}" target="{{g.alvo}}" rel="noopener noreferrer" style="text-underline-offset: 3px;">{{g.t}}</a></sc-if><sc-if value="{{g.forte}}" hint-placeholder-val="{{false}}"><strong style="font-weight: 500; background: {{c.surface}}; padding: 0 2px;">{{g.t}}</strong></sc-if><sc-if value="{{g.enfase}}" hint-placeholder-val="{{false}}"><em>{{g.t}}</em></sc-if><sc-if value="{{g.simples}}" hint-placeholder-val="{{true}}">{{g.t}}</sc-if></sc-for></h3></sc-if>
            <sc-if value="{{b.p}}" hint-placeholder-val="{{true}}"><p style="margin: 0;"><sc-for list="{{b.segs}}" as="g" hint-placeholder-count="1"><sc-if value="{{g.link}}" hint-placeholder-val="{{false}}"><a href="{{g.href}}" target="{{g.alvo}}" rel="noopener noreferrer" style="text-underline-offset: 3px;">{{g.t}}</a></sc-if><sc-if value="{{g.forte}}" hint-placeholder-val="{{false}}"><strong style="font-weight: 500; background: {{c.surface}}; padding: 0 2px;">{{g.t}}</strong></sc-if><sc-if value="{{g.enfase}}" hint-placeholder-val="{{false}}"><em>{{g.t}}</em></sc-if><sc-if value="{{g.simples}}" hint-placeholder-val="{{true}}">{{g.t}}</sc-if></sc-for></p></sc-if>
            <sc-if value="{{b.quote}}" hint-placeholder-val="{{false}}"><blockquote style="margin: 0; padding: 4px 0 4px 18px; border-left: 4px solid #8EA612; font-size: 1.2rem; line-height: 1.5;"><sc-for list="{{b.segs}}" as="g" hint-placeholder-count="1"><sc-if value="{{g.link}}" hint-placeholder-val="{{false}}"><a href="{{g.href}}" target="{{g.alvo}}" rel="noopener noreferrer" style="text-underline-offset: 3px;">{{g.t}}</a></sc-if><sc-if value="{{g.forte}}" hint-placeholder-val="{{false}}"><strong style="font-weight: 500; background: {{c.surface}}; padding: 0 2px;">{{g.t}}</strong></sc-if><sc-if value="{{g.enfase}}" hint-placeholder-val="{{false}}"><em>{{g.t}}</em></sc-if><sc-if value="{{g.simples}}" hint-placeholder-val="{{true}}">{{g.t}}</sc-if></sc-for></blockquote></sc-if>
            <sc-if value="{{b.ul}}" hint-placeholder-val="{{false}}"><ul style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px;"><sc-for list="{{b.itens}}" as="it" hint-placeholder-count="2"><li><sc-for list="{{it.segs}}" as="g" hint-placeholder-count="1"><sc-if value="{{g.link}}" hint-placeholder-val="{{false}}"><a href="{{g.href}}" target="{{g.alvo}}" rel="noopener noreferrer" style="text-underline-offset: 3px;">{{g.t}}</a></sc-if><sc-if value="{{g.forte}}" hint-placeholder-val="{{false}}"><strong style="font-weight: 500; background: {{c.surface}}; padding: 0 2px;">{{g.t}}</strong></sc-if><sc-if value="{{g.enfase}}" hint-placeholder-val="{{false}}"><em>{{g.t}}</em></sc-if><sc-if value="{{g.simples}}" hint-placeholder-val="{{true}}">{{g.t}}</sc-if></sc-for></li></sc-for></ul></sc-if>
            <sc-if value="{{b.ol}}" hint-placeholder-val="{{false}}"><ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px;"><sc-for list="{{b.itens}}" as="it" hint-placeholder-count="2"><li><sc-for list="{{it.segs}}" as="g" hint-placeholder-count="1"><sc-if value="{{g.link}}" hint-placeholder-val="{{false}}"><a href="{{g.href}}" target="{{g.alvo}}" rel="noopener noreferrer" style="text-underline-offset: 3px;">{{g.t}}</a></sc-if><sc-if value="{{g.forte}}" hint-placeholder-val="{{false}}"><strong style="font-weight: 500; background: {{c.surface}}; padding: 0 2px;">{{g.t}}</strong></sc-if><sc-if value="{{g.enfase}}" hint-placeholder-val="{{false}}"><em>{{g.t}}</em></sc-if><sc-if value="{{g.simples}}" hint-placeholder-val="{{true}}">{{g.t}}</sc-if></sc-for></li></sc-for></ol></sc-if>
            <sc-if value="{{b.img}}" hint-placeholder-val="{{false}}"><figure style="margin: 0;"><img src="{{b.src}}" alt="{{b.alt}}" loading="lazy" style="display: block; width: 100%; height: auto;"><sc-if value="{{b.temAlt}}" hint-placeholder-val="{{false}}"><figcaption style="margin-top: 6px; font-size: 13px; color: {{c.muted}};">{{b.alt}}</figcaption></sc-if></figure></sc-if>
          </sc-for>
        </div>

        <sc-if value="{{temTags}}" hint-placeholder-val="{{true}}">
          <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1px solid {{c.line}}; padding-top: 18px; font-size: 13px;">
            <span style="color: {{c.muted}}; letter-spacing: 0.08em; text-transform: uppercase; font-size: 12px;">Tags</span>
            <sc-for list="{{tags}}" as="t" hint-placeholder-count="3"><a href="noticias.html" onClick="{{t.ir}}" style="text-decoration: none; padding: 5px 11px; border-radius: 999px; border: 1.5px solid {{c.line}};">{{t.nome}}</a></sc-for>
          </div>
        </sc-if>
      </article>
      <a href="noticias.html" style="align-self: flex-start; text-decoration: none; border: 2px solid {{c.ink}}; padding: 12px 20px; font-size: 14px;">← Todas as notícias</a>
    </sc-if>
  </main>

  <footer style="background: #060308; color: #F2EEE9; border-top: 1px solid {{c.line}};">
    <div style="max-width: 1240px; margin: 0 auto; padding: 48px 24px 40px; display: flex; flex-wrap: wrap; gap: 40px; justify-content: space-between;">
      <div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 12px;">
        <p style="margin: 0; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;">Tempo Continuum</p>
        <p style="margin: 0; font-size: 1.4rem; line-height: 1.25; max-width: 24ch;"><span style="background: #8EA612; color: #060308; padding: 0 6px; box-decoration-break: clone; -webkit-box-decoration-break: clone;">Conhecer o passado. Organizar o presente. Construir o futuro.</span></p>
      </div>
      <nav aria-label="Rodapé" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 40px; font-size: 14px; align-content: start;">
        <a href="noticias.html" style="text-decoration: none;">Notícias</a>
        <a href="dossies.html" style="text-decoration: none;">Dossiês</a>
        <a href="politicos.html" style="text-decoration: none;">Políticos</a>
        <a href="cursos.html" style="text-decoration: none;">Cursos</a>
        <a href="casos.html" style="text-decoration: none;">Casos</a>
        <a href="index.html" style="text-decoration: none;">Início</a>
        <a href="documentarios.html" style="text-decoration: none;">Documentários</a>
        <a href="ferramentas.html" style="text-decoration: none;">Ferramentas</a>
      </nav>
    </div>
  </footer>
</div>
</template>
<script src="js/runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { escuro: null, menuAberto: false, materia: null, status: 'carregando' };
  }
  componentDidMount() {
    var self = this;
    try {
      var v = window.localStorage.getItem('tc-tema');
      if (v === 'escuro' || v === 'claro') this.setState({ escuro: v === 'escuro' });
    } catch (e) {}
    var id = '';
    try { id = new URLSearchParams(window.location.search).get('id') || ''; } catch (e) {}
    if (!id) { this.setState({ status: 'erro' }); return; }
    if (!/^[a-z0-9][a-z0-9-]*$/.test(id)) { this.setState({ status: 'erro' }); return; }
    fetch('conteudo/noticias/' + id + '.json', { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (m) {
        m.id = id;
        self.setState({ materia: m, status: 'ok' });
        try { document.title = m.titulo + ' — Tempo Continuum'; } catch (e) {}
      })
      .catch(function () { self.setState({ status: 'erro' }); });
  }
  inline(texto) {
    var segs = [], re = /\*\*([^*]+)\*\*|__([^_]+)__|\*([^*]+)\*|_([^_]+)_|\[([^\]]+)\]\(([^)\s]+)\)/g, ultimo = 0, m;
    var seguro = function (h) { return /^(https?:|mailto:|#|[a-z0-9._\/-]+$)/i.test(h) ? h : '#'; };
    var simples = function (t) { if (t) segs.push({ t: t, simples: true, link: false, forte: false, enfase: false }); };
    while ((m = re.exec(texto))) {
      simples(texto.slice(ultimo, m.index));
      if (m[1] || m[2]) segs.push({ t: m[1] || m[2], forte: true, link: false, enfase: false, simples: false });
      else if (m[3] || m[4]) segs.push({ t: m[3] || m[4], enfase: true, link: false, forte: false, simples: false });
      else { var h = seguro(m[6]); segs.push({ t: m[5], href: h, alvo: /^https?:/i.test(h) ? '_blank' : '_self', link: true, forte: false, enfase: false, simples: false }); }
      ultimo = re.lastIndex;
    }
    simples(texto.slice(ultimo));
    return segs;
  }
  blocos(md) {
    var self = this, saida = [], par = [], cit = [], lista = null;
    var vazio = { h2: false, h3: false, p: false, quote: false, ul: false, ol: false, img: false };
    var bloco = function (tipo, extra) { var b = Object.assign({}, vazio, extra || {}); b[tipo] = true; saida.push(b); };
    var fechar = function () {
      if (par.length) { bloco('p', { segs: self.inline(par.join(' ')) }); par = []; }
      if (cit.length) { bloco('quote', { segs: self.inline(cit.join(' ')) }); cit = []; }
      if (lista) { bloco(lista.tipo, { itens: lista.itens }); lista = null; }
    };
    String(md || '').replace(/\r/g, '').split('\n').forEach(function (linha) {
      var l = linha.trim(), m;
      if (!l) { fechar(); return; }
      if ((m = l.match(/^###\s+(.*)/))) { fechar(); bloco('h3', { segs: self.inline(m[1]) }); return; }
      if ((m = l.match(/^##?\s+(.*)/))) { fechar(); bloco('h2', { segs: self.inline(m[1]) }); return; }
      if ((m = l.match(/^!\[([^\]]*)\]\(([^)\s]+)\)$/))) { fechar(); bloco('img', { alt: m[1], temAlt: !!m[1], src: /^https?:/i.test(m[2]) ? m[2] : m[2].replace(/^\/+/, '').replace(/^tempocontinuum\//, '') }); return; }
      if ((m = l.match(/^>\s?(.*)/))) { if (par.length || lista) fechar(); cit.push(m[1]); return; }
      if ((m = l.match(/^[-*+]\s+(.*)/))) { if (par.length || cit.length || (lista && lista.tipo !== 'ul')) fechar(); lista = lista || { tipo: 'ul', itens: [] }; lista.itens.push({ segs: self.inline(m[1]) }); return; }
      if ((m = l.match(/^\d+[.)]\s+(.*)/))) { if (par.length || cit.length || (lista && lista.tipo !== 'ol')) fechar(); lista = lista || { tipo: 'ol', itens: [] }; lista.itens.push({ segs: self.inline(m[1]) }); return; }
      if (cit.length || lista) fechar();
      par.push(l);
    });

  }

    var fmt = function (iso) { var p = String(iso || '').slice(0, 10).split('-'); return p.length === 3 ? Number(p[2]) + ' ' + meses[Number(p[1]) - 1] + ' ' + p[0] : ''; };
    var mat = st.materia;
    var rel = function (u) { u = String(u || '').trim(); return /^https?:/i.test(u) ? u : u.replace(/^\/+/, '').replace(/^tempocontinuum\//, ''); };
    var m = mat ? {

      dataTexto: fmt(mat.data), autor: mat.autor || '', temAutor: !!mat.autor,

    } : {};

      },

      m: m, blocos: mat ? this.blocos(mat.corpo) : [], tags: tags, temTags: tags.length > 0
    };
