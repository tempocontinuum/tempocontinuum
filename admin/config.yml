# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
# Configuração do editor do site (Sveltia CMS): matérias e fichas de políticos.
# Guia da equipe: "Como lançar matérias no Tempo Continuum".

backend:
  name: github
  repo: tempocontinuum/tempocontinuum
  branch: main
  # Login: cada pessoa entra com um token de acesso pessoal do GitHub.
  # Para entrar com o botão "Entrar com GitHub", publique o autenticador
  # (github.com/sveltia/sveltia-cms-auth) e descomente a linha abaixo:
  # base_url: https://sveltia-cms-auth.SEU-SUBDOMINIO.workers.dev
  commit_messages:
    create: "Novo item em {{collection}}: {{slug}}"
    update: "Atualiza item em {{collection}}: {{slug}}"
    delete: "Remove item de {{collection}}: {{slug}}"
    uploadMedia: "Envia imagem: {{path}}"
    deleteMedia: "Remove imagem: {{path}}"

# Cada matéria ou ficha vira um pull request e passa por Rascunho → Em revisão → Pronta.
# Só vai para o site quando alguém clica em "Publicar".
publish_mode: editorial_workflow

site_url: https://tempocontinuum.github.io/tempocontinuum/
logo:
  src: /tempocontinuum/logos/logo-claro.png

media_folder: imagens/materias
public_folder: /imagens/materias

slug:
  encoding: ascii
  clean_accents: true
  maxlength: 80

collections:
  - name: noticias
    label: Notícias
    label_singular: Matéria
    description: 'Matérias publicadas na página Notícias e na Home do site.'
    folder: conteudo/noticias
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: titulo
    summary: "{{titulo}} · {{data | date('DD/MM/YYYY')}}"
    sortable_fields:
      fields: [data, titulo, editoria]
      default:
        field: data
        direction: descending
    preview_path: "materia.html?id={{slug}}"
    fields:
      - name: titulo
        label: Título
        widget: string
        hint: 'Uma ou duas linhas, direto ao fato. Ex.: "Professores de Porto Serrano aprovam estado de greve".'
        maxlength: 140
      - name: linha
        label: Linha fina
        widget: text
        hint: 'Uma ou duas frases que dizem o que está em jogo. Aparece abaixo do título e na lista de notícias.'
        maxlength: 280
      - name: data
        label: Data de publicação
        widget: datetime
        default: "{{now}}"
      - name: editoria
        label: Editoria
        widget: select
        options: [Trabalho, Política, Economia, Cidades, Campo, Educação, Memória, Formação, Cultura, Internacional]
      - name: tags
        label: Tags
        widget: list
        hint: 'Palavras pelas quais a matéria será encontrada na busca. Uma por item, em minúsculas. Reaproveite as tags que já existem.'
        min: 1
        max: 8
      - name: autor
        label: Autoria
        widget: string
        default: Redação
      - name: foto
        label: Foto principal
        widget: image
        required: false
        hint: 'Formato horizontal, de preferência com 1600 px de largura. Só use fotos que vocês podem publicar.'
      - name: legenda
        label: Legenda da foto
        widget: string
        required: false
        hint: 'Descreva o que aparece na foto. Também é o texto lido por leitores de tela.'
      - name: credito
        label: Crédito da foto
        widget: string
        required: false
        hint: 'Nome de quem fez a foto, ou a origem. Ex.: "Maria Souza / Tempo Continuum".'
      - name: destaque
        label: Manchete da Home
        widget: boolean
        default: false
        hint: 'Ligue para esta matéria ser a manchete principal da Home. Se várias estiverem ligadas, vale a mais recente.'
      - name: ficticio
        label: Exemplo fictício
        widget: boolean
        default: false
        hint: 'Só para matérias de demonstração. Mostra o selo "Exemplo fictício" no site.'
      - name: corpo
        label: Texto
        widget: markdown
        buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list]
        editor_components: [image]
        hint: 'Use "Título 2" para os intertítulos. Parágrafos curtos, de 2 a 4 frases.'

  - name: politicos
    label: Políticos
    label_singular: Ficha
    description: 'Fichas de atores políticos. Cada ficha aparece na página Políticos e tem endereço próprio (ficha.html?id=...).'
    folder: conteudo/politicos
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{nome}}"
    identifier_field: nome
    summary: "{{nome}} · {{cargo_curto}} · {{partido}}"
    sortable_fields:
      fields: [nome, partido, atualizado]
      default:
        field: nome
        direction: ascending
    preview_path: "ficha.html?id={{slug}}"
    media_folder: /imagens/politicos
    public_folder: /imagens/politicos
    fields:
      - name: nome
        label: Nome
        widget: string
        hint: 'Nome pelo qual a pessoa é conhecida. Ex.: "Marcel van Hattem". O endereço da ficha é criado a partir dele.'
      - name: iniciais
        label: Iniciais
        widget: string
        required: false
        maxlength: 3
        hint: 'Aparecem no círculo quando não há foto. Ex.: "MH". Se ficar em branco, o site usa as iniciais do nome.'
      - name: foto
        label: Foto
        widget: image
        required: false
        hint: 'Quadrada, de preferência com 600 px. Só use fotos que vocês podem publicar (ex.: fotos oficiais da Câmara ou do Senado, com crédito nas fontes).'
      - name: categoria
        label: Categoria na página Políticos
        widget: select
        options: [Presidente, Senador, Deputado federal, Governador, Prefeito, Deputado estadual, Vereador, Outro]
        hint: 'Define em qual filtro a ficha aparece.'
      - name: cargo_curto
        label: Cargo (curto)
        widget: string
        hint: 'Aparece no cartão da página Políticos. Ex.: "Senador eleito".'
      - name: partido
        label: Partido atual
        widget: string
      - name: uf
        label: Estado (UF)
        widget: string
        maxlength: 2
        required: false
      - name: chamada
        label: Linha do cartão
        widget: string
        required: false
        hint: 'Uma linha curta no cartão da página Políticos. Ex.: "Eleito em 2026 · mandato 2027–2035".'
      - name: subtitulo
        label: Subtítulo da ficha
        widget: string
        hint: 'Linha abaixo do nome. Ex.: "Senador eleito pelo Rio Grande do Sul · Novo".'
      - name: selos
        label: Selos
        widget: list
        required: false
        summary: "{{fields.texto}}"
        hint: 'Etiquetas curtas abaixo do subtítulo. Ex.: "Eleito em 2026", "Mandato 2027–2035".'
        fields:
          - { name: texto, label: Texto, widget: string }
          - { name: destaque, label: Destacar em verde, widget: boolean, default: false }
      - name: dados
        label: Dados
        widget: list
        required: false
        summary: "{{fields.rotulo}}: {{fields.valor}}"
        hint: 'Caixa lateral da ficha. Use sempre os mesmos rótulos: Nome completo, Nascimento, Naturalidade, Formação, Profissão, Partido atual, Cargo.'
        fields:
          - { name: rotulo, label: Rótulo, widget: string }
          - { name: valor, label: Valor, widget: string }
      - name: resumo
        label: Resumo
        widget: text
        hint: 'De 3 a 5 frases, só com fatos verificáveis. Para negrito use **assim**; para itálico, *assim*; para link, [texto](https://...).'
      - name: trajetoria
        label: Trajetória
        widget: list
        required: false
        summary: "{{fields.quando}} · {{fields.fato}}"
        hint: 'Do mais antigo para o mais recente.'
        fields:
          - { name: quando, label: Quando, widget: string, hint: 'Ex.: "2018", "2015–2018", "jul. 2023".' }
          - { name: fato, label: O que aconteceu, widget: string }
      - name: eleicoes
        label: Eleições
        widget: list
        required: false
        summary: "{{fields.ano}} · {{fields.cargo}} · {{fields.resultado}}"
        hint: 'A tabela é ordenada pelo ano automaticamente. Confira os votos no TSE (dadosabertos.tse.jus.br).'
        fields:
          - { name: ano, label: Ano, widget: number, value_type: int }
          - { name: cargo, label: Cargo, widget: string, hint: 'Ex.: "Deputado federal (RS)".' }
          - { name: partido, label: Partido, widget: string }
          - { name: votos, label: Votos, widget: string, required: false, hint: 'Ex.: "349.855" ou "33.931 (0,69%)".' }
          - { name: resultado, label: Resultado, widget: string, hint: 'Ex.: "Eleito · mais votado do RS" ou "Não eleito".' }
          - { name: destaque, label: Destacar o resultado em verde, widget: boolean, default: false, hint: 'Use só na eleição mais recente vencida.' }
      - name: nota_eleicoes
        label: Nota abaixo da tabela de eleições
        widget: string
        required: false
      - name: atuacao_titulo
        label: Título da seção de atuação
        widget: string
        default: Atuação parlamentar
        hint: 'Ex.: "Atuação parlamentar" ou "Atuação e obras".'
      - name: atuacao
        label: Atuação
        widget: list
        required: false
        field: { name: item, label: Item, widget: string }
      - name: posicoes
        label: Posições declaradas
        widget: list
        required: false
        hint: 'Só o que a pessoa disse ou defendeu publicamente, com fonte.'
        field: { name: item, label: Item, widget: string }
      - name: controversias
        label: Controvérsias e processos
        widget: list
        required: false
        hint: 'Comece com a data em negrito. Ex.: "**Nov. 2024:** indiciado pela Polícia Federal...". Registre também a versão da pessoa.'
        field: { name: item, label: Item, widget: string }
      - name: fontes
        label: Fontes
        widget: list
        summary: "{{fields.titulo}}"
        hint: 'Toda informação da ficha precisa estar em alguma destas fontes.'
        fields:
          - { name: titulo, label: Título, widget: string, hint: 'Ex.: "Título da matéria — Veículo, 4 out. 2026".' }
          - { name: url, label: Endereço (link), widget: string }
      - name: atualizado
        label: Data da última revisão
        widget: datetime
        time_format: false
        format: YYYY-MM-DD
        date_format: DD/MM/YYYY
        default: "{{now}}"
