      <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 36px;">

          <h2 style="margin: 0; font-size: 1.4rem;">Resumo</h2>
          <p style="margin: 0; font-size: 1.02rem; line-height: 1.65; max-width: 66ch;">Jornalista e político gaúcho, eleito vereador de Dois Irmãos em 2004, aos 18 anos, pelo Partido Progressista (PP). Foi deputado estadual de 2015 a 2018 e é deputado federal desde 2019, quando já estava no Novo. Em 2018 foi o candidato a deputado federal mais votado do Rio Grande do Sul. Em 2026 foi eleito senador, com cerca de 3,37 milhões de votos.</p>

            <li style="display: flex; gap: 20px; padding: 12px 0; border-top: 1px solid {{c.line}};"><span style="flex: none; width: 92px; font-variant-numeric: tabular-nums;">2007–2009</span><span style="flex: 1; min-width: 0; line-height: 1.5;">Presidente da Juventude Progressista Gaúcha, do PP.</span></li>
            <li style="display: flex; gap: 20px; padding: 12px 0; border-top: 1px solid {{c.line}};"><span style="flex: none; width: 92px; font-variant-numeric: tabular-nums;">2015–2018</span><span style="flex: 1; min-width: 0; line-height: 1.5;">Deputado estadual no RS. Assumiu como suplente e foi o parlamentar mais jovem da 54ª legislatura.</span></li>
            <li style="display: flex; gap: 20px; padding: 12px 0; border-top: 1px solid {{c.line}};"><span style="flex: none; width: 92px; font-variant-numeric: tabular-nums;">2018</span><span style="flex: 1; min-width: 0; line-height: 1.5;">Deixa o PP, filia-se ao Novo e é eleito deputado federal.</span></li>
            <li style="display: flex; gap: 20px; padding: 12px 0; border-top: 1px solid {{c.line}};"><span style="flex: none; width: 92px; font-variant-numeric: tabular-nums;">2019</span><span style="flex: 1; min-width: 0; line-height: 1.5;">Líder da bancada do Novo na Câmara. Vice-presidente da Frente Parlamentar em Defesa da Prisão após Condenação em Segunda Instância.</span></li>
            <li style="display: flex; gap: 20px; padding: 12px 0; border-top: 1px solid {{c.line}};"><span style="flex: none; width: 92px; font-variant-numeric: tabular-nums;">2022</span><span style="flex: 1; min-width: 0; line-height: 1.5;">Reeleito deputado federal.</span></li>
            <li style="display: flex; gap: 20px; padding: 12px 0; border-top: 1px solid {{c.line}}; border-bottom: 1px solid {{c.line}};"><span style="flex: none; width: 92px; font-variant-numeric: tabular-nums;">2026</span><span style="flex: 1; min-width: 0; line-height: 1.5;">Eleito senador pelo Rio Grande do Sul, pelo Novo.</span></li>
          </ol>
        </section>

        <section style="display: flex; flex-direction: column; gap: 12px;">

            <table style="border-collapse: collapse; width: 100%; min-width: 560px; font-size: 0.92rem; font-variant-numeric: tabular-nums;">
              <thead><tr>
                <th style="text-align: left; padding: 10px 12px 10px 0; border-bottom: 2px solid {{c.ink}}; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: {{c.muted}};">Ano</th>
                <th style="text-align: left; padding: 10px 12px; border-bottom: 2px solid {{c.ink}}; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: {{c.muted}};">Cargo</th>
                <th style="text-align: left; padding: 10px 12px; border-bottom: 2px solid {{c.ink}}; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: {{c.muted}};">Partido</th>

        </section>

        <section style="display: flex; flex-direction: column; gap: 12px;">
          <h2 style="margin: 0; font-size: 1.4rem;">Atuação parlamentar</h2>
          <ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; line-height: 1.55; max-width: 66ch;">
            <li>Na Assembleia do RS, apresentou o projeto Escola sem Partido (PL 190/2015), uma proposta para que presos indenizem o Estado pelos custos da prisão (PL 61/2016), a obrigação de órgãos públicos informarem o valor pago em anúncios (PL 335/2015) e uma PEC exigindo plebiscito para criar estatais (PEC 240/2015).</li>
            <li>Renunciou ao aumento salarial aprovado em 2014 na Assembleia e devolveu a diferença mensalmente.</li>
            <li>Na Câmara, votou a favor da Reforma da Previdência, da MP da Liberdade Econômica, da autonomia do Banco Central, do Marco Legal do Saneamento e do Pacote Anticrime.</li>
            <li>Votou contra o aumento do Fundo Partidário, a alteração do Fundo Eleitoral, a Convenção Interamericana contra o Racismo, a manutenção da prisão do deputado Daniel Silveira e a PEC da Imunidade Parlamentar.</li>
          </ul>
        </section>

        <section style="display: flex; flex-direction: column; gap: 12px;">
          <h2 style="margin: 0; font-size: 1.4rem;">Posições declaradas</h2>
          <ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; line-height: 1.55; max-width: 66ch;">
            <li>Defende a prisão após condenação em segunda instância.</li>
            <li>Defende o direito dos pais de orientar a educação moral dos filhos segundo suas convicções.</li>
            <li>Após a eleição de 2026, prometeu pressionar pelo impeachment do ministro do STF Alexandre de Moraes.</li>
          </ul>
        </section>

        <section style="display: flex; flex-direction: column; gap: 12px;">
          <h2 style="margin: 0; font-size: 1.4rem;">Controvérsias e processos</h2>
          <ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; line-height: 1.55; max-width: 66ch;">
            <li><b>Nov. 2024:</b> indiciado pela Polícia Federal por calúnia e injúria, por críticas feitas em plenário ao delegado Fábio Alvarez Schor, responsável por inquéritos supervisionados pelo ministro Alexandre de Moraes.</li>
            <li><b>Set. 2014:</b> durante a campanha, discutiu em público com a então candidata Maria do Rosário e a acusou, com um megafone, de “defender bandidos”. Ele registrou boletim de ocorrência alegando ter sido ofendido.</li>
            <li><b>2006:</b> envolveu-se em um atropelamento em Ivoti (RS); a vítima morreu após sete meses em coma. A ação criminal prescreveu sem julgamento de mérito; a família move processo cível de indenização. Van Hattem atribuiu a repercussão do caso, em 2015, ao uso político por adversários.</li>
          </ul>

            <li><a href="https://revistaoeste.com/politica/novo-lanca-marcel-van-hattem-ao-senado-em-2026/">Novo lança Marcel van Hattem ao Senado em 2026 — Revista Oeste</a></li>

<script>
class Component extends DCLogic {
  constructor(props) {

  componentDidMount() {
    try {
      var v = window.localStorage.getItem('tc-tema');
      if (v === 'escuro' || v === 'claro') this.setState({ escuro: v === 'escuro' });
    } catch (e) {}
  }
  renderVals() {
    var escuro = (this.state && this.state.escuro !== null && this.state.escuro !== undefined)
      ? this.state.escuro
      : (this.props.tema ?? 'claro') === 'escuro';
    var self = this;
    var c = escuro
      ? { bg: '#060308', surface: '#302D29', ink: '#F2EEE9', muted: '#DED5CA', line: 'rgba(222, 213, 202, 0.3)' }
      : { bg: '#F2EEE9', surface: '#DED5CA', ink: '#060308', muted: '#302D29', line: 'rgba(48, 45, 41, 0.28)' };
    return {
      c: c,
      escuro: escuro,
      claro: !escuro,
      temaTexto: escuro ? 'Claro' : 'Escuro',
      temaLabel: escuro ? 'Mudar para o tema claro' : 'Mudar para o tema escuro',
      alternarTema: function () {
        var novo = !escuro;
        self.setState({ escuro: novo });
        try { window.localStorage.setItem('tc-tema', novo ? 'escuro' : 'claro'); } catch (e) {}
      }
    };
  }
}
